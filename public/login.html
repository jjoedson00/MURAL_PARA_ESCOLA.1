<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administrador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-screen">
    <div class="form-box">
        <h2>Acesso Restrito</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border-radius: 8px;">Entrar</button>
        </form>
        <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
            Não tem conta? <a href="cadastro.html" style="color: #1e3c72; font-weight: bold;">Cadastre-se</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const dados = await res.json();
            if (dados.sucesso) {
                window.location.href = 'mural.html';
            } else {
                alert(dados.erro);
            }
        });
    </script>
</body>
</html>
