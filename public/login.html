<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Digital Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
        .tela-mural { width: 100%; max-width: 1400px; margin: 0 auto; }
        .topo-mural { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 24px; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .barra-pesquisa { width: 100%; max-width: 400px; padding: 12px 18px; border: 1px solid #475569; border-radius: 14px; background-color: #1e293b; color: #f8fafc; outline: none; font-size: 0.95rem; }
        .barra-pesquisa:focus { border-color: #38bdf8; }
        .btn-restrita { background-color: #1e293b; color: #e2e8f0; border: 1px solid #475569; padding: 12px 20px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 0.875rem; }
        .btn-restrita:hover { background-color: #334155; }
        .btn-voltar { color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
        .btn-voltar:hover { color: #f8fafc; }
        .grid-mural { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; width: 100%; }
        .card-aviso { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-imagem { width: 100%; height: 180px; object-fit: cover; background-color: #0f172a; }
        .card-corpo { padding: 20px; flex-grow: 1; }
        .card-titulo { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
        .card-conteudo { font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; }
        .card-data { padding: 16px 20px; font-size: 0.75rem; color: #38bdf8; font-weight: 600; border-top: 1px solid rgba(51, 65, 85, 0.5); background-color: #1e293b; }
        .card-vazio { grid-column: 1 / -1; text-align: center; padding: 80px 24px; background-color: rgba(30, 41, 59, 0.5); border-radius: 16px; border: 2px dashed #334155; }
    </style>
</head>
<body>
    <div class="tela-mural">
        <header class="topo-mural">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800;">🏫 Mural Digital Escolar</h1>
                <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 4px;">Monitores e Celulares</p>
            </div>
            
            <!-- Barra de Busca Inteligente -->
            <input type="text" id="campo-busca" class="barra-pesquisa" placeholder="🔍 Pesquisar aviso específico..." oninput="filtrarAvisosNaTela()">

            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="login.html" class="btn-restrita">⚙️ Área Restrita</a>
                <a href="index.html" class="btn-voltar">Voltar ↩</a>
            </div>
        </header>

        <main>
            <div id="id-mural-container" class="grid-mural">
                <div class="card-vazio">
                    <span style="font-size: 3rem; display: block; margin-bottom: 16px;">📭</span>
                    <p style="color: #94a3b8; font-size: 1.125rem;">Carregando os avisos escolares...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const containerMural = document.getElementById('id-mural-container');
        let todosOsAvisosCache = [];

        async function buscarAvisosDoBanco() {
            try {
                const res = await fetch('/api/avisos');
                todosOsAvisosCache = await res.json();
                renderizarAvisos(todosOsAvisosCache);
            } catch (err) {
                console.log("Banco offline.");
            }
        }

        function renderizarAvisos(lista) {
            containerMural.innerHTML = '';
            if (!lista || lista.length === 0) {
                containerMural.innerHTML = `
                    <div class="card-vazio">
                        <span style="font-size: 3rem; display: block; margin-bottom: 16px;">📭</span>
                        <p style="color: #94a3b8; font-size: 1.125rem;">Nenhum aviso ativo no momento.</p>
                    </div>`;
                return;
            }
            lista.forEach(aviso => {
                const dataStr = new Date(aviso.data_criacao).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                containerMural.innerHTML += `
                    <div class="card-aviso">
                        ${aviso.imagem ? `<img src="${aviso.imagem}" class="card-imagem" alt="Referência">` : ''}
                        <div class="card-corpo">
                            <h3 class="card-titulo">${aviso.titulo}</h3>
                            <p class="card-conteudo">${aviso.conteudo}</p>
                        </div>
                        <div class="card-data">🕒 Publicado em: ${dataStr}</div>
                    </div>`;
            });
        }

        function filtrarAvisosNaTela() {
            const termoBusca = document.getElementById('campo-busca').value.toLowerCase().trim();
            const filtrados = todosOsAvisosCache.filter(aviso => {
                return aviso.titulo.toLowerCase().includes(termoBusca) || aviso.conteudo.toLowerCase().includes(termoBusca);
            });
            renderizarAvisos(filtrados);
        }

        buscarAvisosDoBanco();
        setInterval(() => {
            const pesquisando = document.getElementById('campo-busca').value.trim().length > 0;
            if (!pesquisando) buscarAvisosDoBanco();
        }, 30000);
    </script>
</body>
</html>
