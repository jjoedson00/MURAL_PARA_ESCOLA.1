<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mural Escolar</title>
    <!-- 🎯 Adicionado ?v=2 para forçar o tamanho gigante e quebrar o cache -->
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div id="notification-container"></div>

    <!-- O CSS atualizado (.form-container) vai deixar esta caixa bem maior automaticamente -->
    <div class="form-container">
        <h2>Área do Professor</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@escola.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>
        <p style="margin-top: 30px; text-align: center; font-size: 1.2rem;">Não tem conta? <a href="cadastro.html" style="color: #1e3c72; font-weight: bold;">Cadastre-se</a></p>
    </div>

    <script>
        function mostrarNotificacao(mensagem, tipo = 'error') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const dados = await res.json();
            if (dados.sucesso) {
                window.location.href = 'mural.html';
            } else {
                mostrarNotificacao(dados.erro, 'error');
            }
        });
    </script>
</body>
</html>
