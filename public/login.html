<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Mural Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .box-login { background-color: #ffffff; padding: 32px; border-radius: 24px; width: 100%; max-width: 420px; color: #0f172a; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .input-grupo { margin-bottom: 16px; text-align: left; }
        .input-grupo label { display: block; font-size: 0.875rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .input-grupo input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; font-size: 1rem; color: #0f172a; outline: none; }
        .btn-enviar { width: 100%; background-color: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-top: 8px; }
        .btn-enviar:hover { background-color: #1d4ed8; }
        .btn-voltar { display: block; text-align: center; color: #64748b; margin-top: 20px; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
        .btn-voltar:hover { color: #1e293b; }
    </style>
</head>
<body>
    <div id="box-login" class="box-login">
        <div style="text-align: center; margin-bottom: 24px;">
            <span style="font-size: 2.5rem;">🔐</span>
            <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Acesso Restrito</h2>
            <p style="color: #64748b; font-size: 0.875rem; margin-top: 2px;">Docentes, Coordenação e Direção</p>
        </div>
        <form id="form-login">
            <div class="input-grupo"><label>Nome de Usuário ou E-mail</label><input type="text" id="login-username" required placeholder="Ex: prof_carlos"></div>
            <div class="input-grupo"><label>Senha</label><input type="password" id="login-password" required placeholder="••••••••"></div>
            <button type="submit" class="btn-enviar">Entrar no Gerenciador</button>
        </form>
        <p style="text-align: center; font-size: 0.875rem; margin-top: 20px; color: #475569;">Novo professor? <button type="button" onclick="document.getElementById('box-login').style.display='none'; document.getElementById('box-cadastro').style.display='block';" style="color: #2563eb; font-weight: bold; background: none; border: none; cursor: pointer; text-decoration: underline;">Cadastre-se aqui</button></p>
        <!-- ALTERADO: Link corrigido sem a barra -->
        <a href="mural.html" class="btn-voltar">← Voltar para o Mural</a>
    </div>

    <div id="box-cadastro" class="box-login" style="display: none;">
        <div style="text-align: center; margin-bottom: 24px;">
            <span style="font-size: 2.5rem;">👨‍🏫</span>
            <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Registro de Docente</h2>
            <p style="color: #64748b; font-size: 0.875rem; margin-top: 2px;">Proteção contra acessos de alunos</p>
        </div>
        <form id="form-cadastro">
            <div class="input-grupo"><label>Nome de Usuário Desejado</label><input type="text" id="cad-username" required placeholder="Ex: prof_ana"></div>
            <div class="input-grupo"><label>E-mail Institucional</label><input type="email" id="cad-email" required placeholder="Ex: ana@escola.com"></div>
            <div class="input-grupo"><label>Crie uma Senha Segura</label><input type="password" id="cad-password" required placeholder="Mínimo 6 caracteres"></div>
            <div class="input-grupo"><label style="color: #c2410c;">🔑 Chave de Acesso Administrativo</label><input type="password" id="cad-chave" required placeholder="Código Secreto Fornecido" style="border-color: #fdba74; background-color: #fff7ed;"></div>
            <button type="submit" class="btn-enviar" style="background-color: #16a34a;">Validar e Cadastrar</button>
        </form>
        <p style="text-align: center; font-size: 0.875rem; margin-top: 20px; color: #475569;">Já possui uma conta? <button type="button" onclick="document.getElementById('box-cadastro').style.display='none'; document.getElementById('box-login').style.display='block';" style="color: #2563eb; font-weight: bold; background: none; border: none; cursor: pointer; text-decoration: underline;">Fazer Login</button></p>
    </div>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('cad-username').value;
            const email = document.getElementById('cad-email').value;
            const password = document.getElementById('cad-password').value;
            const chaveAcesso = document.getElementById('cad-chave').value;

            if (chaveAcesso !== 'COORDENACAO2026') { alert('❌ Código Secreto incorreto! Cadastro recusado.'); return; }

            const res = await fetch('/api/cadastro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, chaveAcesso }) });
            const data = await res.json();
            if (res.ok) { alert('✅ Registro aceito com sucesso! Faça o seu login.'); location.reload(); } else { alert('❌ Erro: ' + data.erro); }
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            if (res.ok) { window.location.href = '/admin.html'; } else { const data = await res.json(); alert('❌ Falha na autenticação: ' + data.erro); }
        });
    </script>
</body>
</html>
