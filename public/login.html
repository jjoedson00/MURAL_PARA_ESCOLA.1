<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Professor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-box-grande {
            background: #ffffff;
            padding: 50px;
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .form-box-grande h2 {
            font-size: 2.5rem;
            margin-bottom: 35px;
            text-align: center;
            color: #1e3c72;
            font-weight: 700;
        }

        .input-group-grande {
            margin-bottom: 30px;
        }

        .input-group-grande label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.3rem;
            color: #333;
        }

        .input-group-grande input {
            width: 100%;
            padding: 18px;
            border: 2px solid #bbb;
            border-radius: 12px;
            font-size: 1.25rem;
        }

        .btn-grande {
            background-color: #ff8c00;
            color: white;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-grande:hover {
            background-color: #e07b00;
        }

        .mensagem-alerta-tela {
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            display: none;
        }

        .alerta-erro-tela {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
    </style>
</head>
<body class="form-screen">
    
    <div class="form-box-grande">
        <h2>Acesso do Professor</h2>
        
        <div id="mensagemFeedback" class="mensagem-alerta-tela alerta-erro-tela"></div>

        <form id="loginForm">
            <div class="input-group-grande">
                <label>E-mail Cadastrado</label>
                <input type="email" id="email" placeholder="seuemail@escola.com" required>
            </div>
            
            <div class="input-group-grande">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Sua senha de acesso" required>
            </div>
            
            <button type="submit" class="btn-grande">Entrar no Painel</button>
        </form>
        
        <p style="margin-top: 25px; text-align: center; font-size: 1.15rem;">
            Ainda não tem conta? <a href="cadastro.html" style="color: #1e3c72; font-weight: bold; text-decoration: none;">Cadastre-se aqui</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const caixaMensagem = document.getElementById('mensagemFeedback');

            caixaMensagem.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                
                const dados = await res.json();
                
                if (dados.sucesso) {
                    window.location.href = 'mural.html'; // Vai direto para o mural logado
                } else {
                    caixaMensagem.textContent = dados.erro;
                    caixaMensagem.style.display = 'block';
                }
            } catch {
                caixaMensagem.textContent = 'Erro ao se conectar com o servidor.';
                caixaMensagem.style.display = 'block';
            }
        });
    </script>
</body>
</html>
