<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Mural Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .box-login { background-color: #ffffff; padding: 40px 36px; border-radius: 24px; width: 100%; max-width: 460px; color: #0f172a; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .input-grupo { margin-bottom: 20px; }
        .input-grupo label { display: block; font-size: 0.9rem; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .input-grupo input { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; font-size: 1rem; outline: none; }
        .btn-enviar { width: 100%; background-color: #2563eb; color: white; font-weight: bold; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-top: 12px; }
        .btn-voltar { display: block; text-align: center; color: #64748b; margin-top: 20px; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box-login">
        <div style="text-align: center; margin-bottom: 24px;">
            <span style="font-size: 2.5rem;">🔐</span>
            <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Acesso Restrito</h2>
            <p style="color: #64748b; font-size: 0.875rem;">Docentes e Coordenação</p>
        </div>
        <form id="form-login">
            <div class="input-grupo"><label>Usuário</label><input type="text" id="login-username" required></div>
            <div class="input-grupo"><label>Senha</label><input type="password" id="login-password" required></div>
            <button type="submit" class="btn-enviar">Entrar no Gerenciador</button>
        </form>
        <p style="text-align: center; font-size: 0.875rem; margin-top: 20px; color: #475569;">Novo? <a href="cadastro.html" style="color: #2563eb; font-weight: bold;">Cadastre-se</a></p>
        <a href="mural.html" class="btn-voltar">← Voltar para o Mural</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get } from "https://gstatic.com";

        const firebaseConfig = { databaseURL: "https://firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (username === 'admin' && password === 'admin123') { window.location.href = 'admin.html'; return; }

            const userRef = ref(db, 'usuarios/' + username);
            const snapshot = await get(userRef);
            if (snapshot.exists() && snapshot.val().password === password) { window.location.href = 'admin.html'; }
            else { alert('❌ Usuário ou senha incorretos.'); }
        });
    </script>
</body>
</html>
