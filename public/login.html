<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mural Escolar</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container-form">
        <form id="form-login">
            <h2>Acessar Painel</h2>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Digite seu e-mail">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>
            <button type="submit">Entrar</button>
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </form>
    </div>

    <script type="module">
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById('email').value;
            const senhaInput = document.getElementById('senha').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput, senha: senhaInput })
                });

                const resultado = await response.json();

                if (response.ok && resultado.autenticado) {
                    alert('🔓 Autenticação aceita! Entrando no painel gerenciador...');
                    window.location.href = 'admin.html';
                } else {
                    alert(`❌ ${resultado.erro || 'Credenciais incorretas!'}`);
                }

            } catch (error) {
                console.error("Erro de conexão com o login:", error);
                alert('❌ Falha interna de comunicação com o servidor.');
            }
        });
    </script>
</body>
</html>
