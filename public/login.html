<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login do Professor</title>
<link rel="stylesheet" href="style.css">
<style>
.campo-senha{position:relative}
.senha-wrapper{position:relative;width:100%}
.senha-wrapper input{width:100%;padding-right:65px}
.btn-ver-senha{position:absolute;right:1px;top:1px;width:56px;height:calc(100% - 2px);padding:0;border:0;border-left:1px solid #d1d5db;border-radius:0 8px 8px 0;background:#f8fafc;color:#aeb7c5;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-ver-senha:hover{background:#f1f5f9}
.icone-olho{width:22px;height:14px;border:3px solid #aeb7c5;border-radius:50%/60%;position:relative;display:block}
.icone-olho::after{content:'';position:absolute;width:7px;height:7px;background:#aeb7c5;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>

<body class="pagina-login" style="visibility:hidden;">

<div class="login-container">

<a href="/index.html" class="fechar-login">✕</a>

<h2>👨‍🏫 Acesso do Professor</h2>

<form id="form-login">

<div class="form-group">
<label for="email">E-mail</label>
<input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
</div>

<div class="form-group campo-senha">
<label for="senha">Senha</label>
<div class="senha-wrapper">
<input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
<button type="button" class="btn-ver-senha" id="btn-ver-senha" aria-label="Mostrar senha">
<span class="icone-olho"></span>
</button>
</div>
</div>

<div id="mensagem-erro"></div>

<button type="submit" class="btn-submit">Entrar</button>

</form>

<p class="login-cadastro">
Ainda não possui uma conta?
<a href="/cadastro.html">Cadastre-se</a>
</p>

</div>

<script>
const formulario=document.getElementById('form-login');
const mensagemErro=document.getElementById('mensagem-erro');
const senha=document.getElementById('senha');
const btnVerSenha=document.getElementById('btn-ver-senha');

btnVerSenha.addEventListener('click',()=>{
if(senha.type==='password'){
senha.type='text';
btnVerSenha.setAttribute('aria-label','Esconder senha');
}else{
senha.type='password';
btnVerSenha.setAttribute('aria-label','Mostrar senha');
}
});

async function verificarSessao(){
try{
const resposta=await fetch('/api/sessao',{
credentials:'include'
});

const dados=await resposta.json();

if(dados.logado){
window.location.href='/admin.html';
return;
}

document.body.style.visibility='visible';

}catch(erro){
console.error(erro);
document.body.style.visibility='visible';
}
}

formulario.addEventListener('submit',async function(event){
event.preventDefault();

mensagemErro.style.display='none';
mensagemErro.textContent='';

const email=document.getElementById('email').value.trim();
const senhaValor=senha.value;

try{
const resposta=await fetch('/api/login',{
method:'POST',
credentials:'include',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
email,
senha:senhaValor
})
});

const dados=await resposta.json();

if(!resposta.ok){
mensagemErro.textContent=dados.erro||'E-mail ou senha incorretos.';
mensagemErro.style.display='block';
return;
}

window.location.href='/admin.html';

}catch(erro){
console.error(erro);
mensagemErro.textContent='Não foi possível conectar ao servidor.';
mensagemErro.style.display='block';
}
});

verificarSessao();
</script>

</body>
</html>
