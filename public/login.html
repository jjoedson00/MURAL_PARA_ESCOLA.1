<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso Restrito - Mural Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Centralização absoluta em qualquer tamanho de tela (TV, PC, Celular) */
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        /* CAIXA RESPONSIVA: Ocupa até 550px em TVs/PCs e encolhe perfeitamente em telas menores */
        .box-login { 
            background-color: #ffffff; 
            padding: 40px 36px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 550px; 
            color: #0f172a; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
        }

        .input-grupo { margin-bottom: 20px; width: 100%; }
        .input-grupo label { display: block; font-size: 0.95rem; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .input-grupo input { width: 100%; padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; font-size: 1.05rem; outline: none; color: #0f172a; }
        .input-grupo input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        
        .btn-enviar { width: 100%; background-color: #2563eb; color: white; font-weight: bold; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.1rem; margin-top: 12px; transition: background 0.2s; }
        .btn-enviar:hover { background-color: #1d4ed8; }
        .btn-voltar { display: block; text-align: center; color: #64748b; margin-top: 24px; text-decoration: none; font-size: 0.95rem; font-weight: 600; }
        .btn-voltar:hover { color: #1e293b; }
    </style>
</head>
<body>
    <div class="box-login">
        <div style="text-align: center; margin-bottom: 28px;">
            <span style="font-size: 3rem;">🔐</span>
            <h2 style="font-size: 1.75rem; font-weight: 900; margin-top: 8px;">Acesso Restrito</h2>
            <p style="color: #64748b; font-size: 1rem; margin-top: 4px;">Docentes e Coordenação</p>
        </div>
        <form id="form-login">
            <div class="input-grupo">
                <label>Usuário ou E-mail</label>
                <input type="text" id="login-username" required placeholder="Digite seu usuário ou e-mail institucional">
            </div>
            <div class="input-grupo">
                <label>Senha</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-enviar">Entrar no Gerenciador</button>
        </form>
        <p style="text-align: center; font-size: 1rem; margin-top: 24px; color: #475569;">Novo? <a href="cadastro.html" style="color: #2563eb; font-weight: bold; text-decoration: underline;">Cadastre-se</a></p>
        <a href="mural.html" class="btn-voltar">← Voltar para o Mural</a>
    </div>

    <!-- Script de Login Corrigido com Validação Assíncrona via Firebase -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get } from "https://gstatic.com";

        const firebaseConfig = { databaseURL: "https://firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // O evento foi marcado como 'async' para permitir que o navegador espere os dados da nuvem
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            // Login Máster de Fábrica Livre para Testes Rápidos
            if (username === 'admin' && password === 'admin123') { 
                window.location.href = 'admin.html'; 
                return; 
            }

            try {
                // 1. Tenta fazer a busca direta assumindo que foi digitado o Nome de Usuário
                const userRef = ref(db, 'usuarios/' + username);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    // Valida se a senha confere com a salva no banco
                    if (snapshot.val().password === password) {
                        alert('🔓 Autenticação aceita! Entrando no painel gerenciador...');
                        window.location.href = 'admin.html';
                        return;
                    }
                }

                // 2. Caso não encontre, faz uma varredura para validar se foi digitado o E-mail
                const todosUsuariosRef = ref(db, 'usuarios');
                const todosSnapshot = await get(todosUsuariosRef);
                let usuarioEncontradoPorEmail = null;

                if (todosSnapshot.exists()) {
                    todosSnapshot.forEach((childSnapshot) => {
                        if (childSnapshot.val().email === username && childSnapshot.val().password === password) {
                            usuarioEncontradoPorEmail = childSnapshot.val();
                        }
                    });
                }

                if (usuarioEncontradoPorEmail) {
                    alert('🔓 Autenticação aceita via e-mail! Entrando no painel gerenciador...');
                    window.location.href = 'admin.html';
                    return;
                }

                // Se falhar em ambas as travas do servidor, emite o bloqueio
                alert('❌ Credenciais incorretas! Verifique os dados digitados.');

            } catch (error) {
                console.error("Erro no Firebase:", error);
                alert('❌ Falha interna de comunicação com a nuvem.');
            }
        });
    </script>
</body>
</html>
