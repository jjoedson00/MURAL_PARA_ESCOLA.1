<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Educador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth-bg">

    <div class="modal-static">
        <div class="modal-content-fixed">
            <a href="mural.html" class="close-auth">&times;</a>
            <h3>Login do Educador</h3>
            <form id="form-login">
                <input type="email" id="login-email" placeholder="E-mail institucional" required>
                <input type="password" id="login-senha" placeholder="Sua senha" required>
                <button type="submit" class="btn-primary-block">Entrar</button>
            </form>
            <p class="switch-form">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </div>

    <script>
        document.getElementById("form-login").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const senha = document.getElementById("login-senha").value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const data = await res.json();

            if(data.sucesso) {
                window.location.href = "mural.html";
            } else {
                alert(data.erro || "Usuário ou senha incorretos.");
            }
        });
    </script>
</body>
</html>
