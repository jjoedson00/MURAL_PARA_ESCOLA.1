<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos Escolares - Boas-Vindas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .tela-inicial { background: linear-gradient(135deg, #1d4ed8, #1e1b4b); width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
        .titulo { font-size: 2.5rem; font-weight: 900; margin-bottom: 12px; }
        .subtitulo { color: #dbeafe; max-width: 400px; margin-bottom: 32px; line-height: 1.6; }
        .btn-laranja { background-color: #f97316; color: #ffffff; font-weight: bold; font-size: 1.125rem; padding: 16px 40px; border-radius: 9999px; text-decoration: none; box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); transition: background 0.2s; display: inline-block; }
        .btn-laranja:hover { background-color: #ea580c; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="tela-inicial">
        <div style="font-size: 5rem; margin-bottom: 24px;">📢</div>
        <h1 class="titulo">Mural de Avisos</h1>
        <p class="subtitulo">Acompanhe em tempo real todas as atualizações, events e comunicados importantes da nossa escola.</p>
        <a href="mural.html" class="btn-laranja">Acessar Mural</a>
    </div>
</body>
</html>
