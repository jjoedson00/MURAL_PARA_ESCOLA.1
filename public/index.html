<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural Escolar Digital</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Controle estrito de exibição de telas do SPA */
        .tela { display: none !important; }
        .tela.ativa { display: flex !important; flex-direction: column; }
        
        /* Estilos específicos da tela de boas-vindas ocupando 100% da tela */
        .boas-vindas-wrapper {
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white;
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box;
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
        }
        .boas-vindas-wrapper h1 { font-size: 3rem; margin: 20px 0 10px 0; font-weight: 700; color: white !important; }
        .boas-vindas-wrapper p { font-size: 1.2rem; color: #e2e8f0; max-width: 550px; margin-bottom: 35px; line-height: 1.6; }
        
        /* Botão Laranja Uniforme e Reduzido */
        .btn-laranja {
            background-color: #ff9200; color: white; border: none; padding: 14px 45px;
            border-radius: 30px; font-size: 1.15rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 146, 0, 0.4); width: 100%; max-width: 250px; transition: 0.2s;
        }
        .btn-laranja:hover { background-color: #e08100; transform: translateY(-2px); }
        
        /* Cabeçalho do Mural Público */
        .mural-header-titulo {
            color: #ffffff; 
            margin: 0; 
            font-size: 2.2rem; 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }

        /* Correção definitiva de alinhamento e isolamento do contêiner de senha */
        .campo-senha-container { 
            position: relative; 
            width: 100%; 
            display: block !important; 
            margin-bottom: 0px;
        }
        .campo-senha-container input {
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .btn-ver-senha { 
            position: absolute !important; 
            right: 15px !important; 
            top: 50% !important; 
            transform: translateY(-50%) !important; 
            background: none !important; 
            border: none !important; 
            color: #64748b !important; 
            font-size: 18px !important; 
            cursor: pointer !important;
            width: auto !important;
            padding: 0 !important;
            box-shadow: none !important;
            z-index: 5;
        }

        /* Classes de alertas e links utilitários */
        .erro-alerta { background-color: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; border: 1px solid #fca5a5; font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: 600; }
        .link-navegacao { color: #2563eb; cursor: pointer; text-decoration: none; font-weight: 600; }
        .link-navegacao:hover { text-decoration: underline; }
        
        /* Ajuste do select para se comportar igual aos seus inputs originais */
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            background-color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- TELA 1: BOAS-VINDAS -->
    <div id="tela-boas-vindas" class="tela ativa boas-vindas-wrapper">
        <div style="font-size: 5rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));">📢</div>
        <h1>Mural de Avisos</h1>
        <p>Acompanhe em tempo real todas as atualizações, eventos e comunicados importantes.</p>
        <button type="button" class="btn-laranja" onclick="mudarTela('tela-mural')">Acessar Mural</button>
    </div>

    <!-- TELA 2: MURAL PÚBLICO -->
    <div id="tela-mural" class="tela" style="padding: 20px; width: 100%; box-sizing: border-box;">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto 30px auto; padding: 10px 0;">
            <h1 class="mural-header-titulo">
                <span>🏛️</span> Mural Escolar
            </h1>
            <button class="btn-laranja" style="max-width: 160px; padding: 12px 20px; font-size: 0.95rem; margin: 0;" onclick="mudarTela('tela-login')">Área Restrita</button>
        </header>
        <div id="mural-container" class="container">
            <p style="text-align:center; color:#64748b;">Nenhum aviso publicado no momento.</p>
        </div>
    </div>

    <!-- TELA 3: LOGIN -->
    <div id="tela-login" class="tela container">
        <div class="form-header"><h2>Mural Escolar - Login</h2></div>
        <div id="mensagem-erro" class="erro-alerta tela"></div>
        <form id="form-login">
            <input type="text" id="identificador" placeholder="Nome de Usuário ou E-mail" required>
            <div class="campo-senha-container">
                <input type="password" id="senha" placeholder="Sua Senha" required>
                <button type="button" class="btn-ver-senha" onclick="alternarVisibilidade('senha', this)">👁️</button>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <span class="link-navegacao" onclick="mudarTela('tela-cadastro')">Cadastre-se</span></p>
        <p style="margin-top: 10px;"><span class="link-navegacao" onclick="mudarTela('tela-mural')">Voltar ao Mural</span></p>
    </div>

    <!-- TELA 4: CADASTRO -->
    <div id="tela-cadastro" class="tela container">
        <div class="form-header"><h2>Criar Conta</h2></div>
        <div id="mensagem-erro-cad" class="erro-alerta tela"></div>
        <form id="form-cadastro">
            <input type="text" id="cad-nome" placeholder="Nome de Usuário" required>
            <input type="email" id="cad-email" placeholder="Seu E-mail" required>
            <div class="campo-senha-container" style="margin-bottom: 15px;">
                <input type="password" id="cad-senha" placeholder="Sua Senha (Mínimo 6 dígitos)" minlength="6" required>
                <button type="button" class="btn-ver-senha" onclick="alternarVisibilidade('cad-senha', this)">👁️</button>
            </div>
            <select id="cad-cargo" required>
                <option value="aluno">Aluno</option>
                <option value="responsavel">Responsável</option>
                <option value="professor">Professor</option>
                <option value="coordenador">Coordenador</option>
                <option value="direcao">Direção</option>
            </select>
            <input type="text" id="cad-chave" placeholder="Chave de Acesso (Apenas Funcionários)">
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem conta? <span class="link-navegacao" onclick="mudarTela('tela-login')">Fazer Login</span></p>
    </div>

    <script>
        // Mantém a barra de endereços URL limpa
        window.addEventListener('DOMContentLoaded', () => {
            window.history.pushState({}, '', '/');
            carregarAvisos();
        });

        // Atualização automática dos avisos no monitor a cada 15 segundos
        setInterval(carregarAvisos, 15000);

        function mudarTela(idTela) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            
            if (idTela !== 'tela-boas-vindas') {
                document.getElementById('tela-boas-vindas').style.setProperty('display', 'none', 'important');
            }
            
            document.getElementById(idTela).classList.add('ativa');
            if(idTela === 'tela-mural') carregarAvisos();
        }

        function alternarVisibilidade(idCampo, botao) {
            const campo = document.getElementById(idCampo);
            campo.type = campo.type === "password" ? "text" : "password";
            botao.innerText = campo.type === "password" ? "👁️" : "🙈";
        }

        // Envio do formulário de login integrado
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identificador = document.getElementById('identificador').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('mensagem-erro');
            erroDiv.classList.add('tela');

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identificador, senha })
            });
            const dados = await res.json();
            if (!res.ok) { erroDiv.innerText = dados.erro; erroDiv.classList.remove('tela'); }
            else { mudarTela('tela-mural'); }
        });

        // Envio do formulário de cadastro integrado
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;
            const cargo = document.getElementById('cad-cargo').value;
            const chaveAcesso = document.getElementById('cad-chave').value;
            const erroDiv = document.getElementById('mensagem-erro-cad');
            erroDiv.classList.add('tela');
