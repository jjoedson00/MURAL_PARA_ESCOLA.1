<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural de Avisos Escolares</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .flex-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ----------------------------------------------------------------- */
        /* GESTÃO DE TELAS NATIVAS VIA CSS                                   */
        /* ----------------------------------------------------------------- */
        
        .controlador-tela {
            display: none !important;
        }

        .tela-inicial, .tela-mural, .tela-login {
            display: none;
        }

        /* Ativação das telas com base no rádio botão selecionado */
        #checar-inicial:checked ~ .tela-inicial { display: flex; }
        #checar-mural:checked ~ .tela-mural { display: block; }
        #checar-login:checked ~ .tela-login { display: flex; }

        /* 1. Tela Inicial de Boas-Vindas */
        .tela-inicial {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: linear-gradient(135deg, #1d4ed8, #1e1b4b);
            padding: 24px;
            text-align: center;
        }

        .titulo-boas-vindas {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.05em;
        }

        .subtitulo-boas-vindas {
            color: #dbeafe;
            font-size: 1rem;
            max-width: 400px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-laranja-click {
            background-color: #f97316;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.125rem;
            padding: 16px 40px;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-laranja-click:hover {
            background-color: #ea580c;
            transform: translateY(-2px);
        }

        /* 2. Tela do Mural Público */
        .tela-mural {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            z-index: 20;
        }

        .topo-mural {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .barra-pesquisa {
            width: 100%;
            max-width: 400px;
            padding: 12px 18px;
            border: 1px solid #475569;
            border-radius: 14px;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .barra-pesquisa:focus {
            border-color: #38bdf8;
        }

        .btn-restrita-click {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }

        .btn-restrita-click:hover {
            background-color: #334155;
        }

        .btn-voltar-click {
            background-color: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            padding: 10px;
            font-size: 0.875rem;
            display: inline-block;
            font-weight: 600;
        }

        .btn-voltar-click:hover {
            color: #f1f5f9;
        }

        /* Grid Organizador de Avisos */
        .grid-mural {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card-aviso {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-imagem {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .card-corpo {
            padding: 20px;
            flex-grow: 1;
        }

        .card-titulo {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .card-conteudo {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .card-data {
            padding: 16px 20px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
            background-color: #1e293b;
        }

        .card-vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            background-color: rgba(30, 41, 59, 0.5);
            border-radius: 16px;
            border: 2px dashed #334155;
        }

        /* 3. Modal de Login / Cadastro */
        .tela-login {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background-color: rgba(15, 23, 42, 0.97);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-login {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            color: #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .input-grupo {
            margin-bottom: 16px;
            text-align: left;
            width: 100%;
        }

        .input-grupo label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-grupo input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
        }

        .input-grupo input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .btn-enviar {
            width: 100%;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-enviar:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body class="flex-center">

    <!-- CONTROLES INVISÍVEIS PARA MUDANÇA DE TELA -->
    <input type="radio" name="abas-mural" id="checar-inicial" class="controlador-tela" checked>
    <input type="radio" name="abas-mural" id="checar-mural" class="controlador-tela">
    <input type="radio" name="abas-mural" id="checar-login" class="controlador-tela">

    <!-- ==================== 1. TELA INICIAL (BOAS-VINDAS) ==================== -->
    <div class="tela-inicial flex-center">
        <div style="font-size: 5rem; margin-bottom: 24px;">📢</div>
        <h1 class="titulo-boas-vindas">Mural de Avisos</h1>
        <p class="subtitulo-boas-vindas">
            Acompanhe em tempo real todas as atualizações, eventos e comunicados importantes da nossa escola.
        </p>
        <label for="checar-mural" class="btn-laranja-click" onclick="buscarAvisosDoBanco()">
            Acessar Mural
        </label>
    </div>

    <!-- ==================== 2. TELA DO MURAL PÚBLICO (EXIBIÇÃO) ==================== -->
    <div class="tela-mural">
        <header class="topo-mural">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; color: white;">🏫 Mural Digital Escolar</h1>
                <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 4px; margin-bottom: 12px;">Monitores e Celulares</p>
            </div>
            
            <input type="text" id="campo-busca" class="barra-pesquisa" placeholder="🔍 Pesquisar aviso específico..." oninput="filtrarAvisosNaTela()">

            <div style="display: flex; align-items: center; gap: 16px;">
                <label for="checar-login" class="btn-restrita-click">⚙️ Área Restrita</label>
                <label for="checar-inicial" class="btn-voltar-click">Voltar ↩</label>
            </div>
        </header>

        <main>
            <div id="id-mural-container" class="grid-mural">
                <div class="card-vazio">
                    <span style="font-size: 3rem; display: block; margin-bottom: 16px;">📭</span>
