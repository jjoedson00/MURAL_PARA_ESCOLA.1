<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural de Avisos Escolares</title>
    
    <!-- Módulos oficiais do Firebase do Google -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, push, get, child } from "https://gstatic.com";

        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.dbFirebase = db;
        window.refFirebase = ref;
        window.pushFirebase = push;
        window.setFirebase = set;
        window.getFirebase = get;
        window.childFirebase = child;
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .flex-center { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tela-sistema { display: none; width: 100%; }

        /* 1. Tela Inicial */
        #id-tela-inicial { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; background: linear-gradient(135deg, #1d4ed8, #1e1b4b); padding: 24px; text-align: center; }
        .titulo-boas-vindas { font-size: 2.5rem; font-weight: 900; color: #ffffff; margin-bottom: 12px; }
        .subtitulo-boas-vindas { color: #dbeafe; font-size: 1rem; max-width: 400px; margin-bottom: 32px; line-height: 1.6; }
        .btn-laranja { background-color: #f97316; color: #ffffff; font-weight: bold; font-size: 1.125rem; padding: 16px 40px; border: none; border-radius: 9999px; cursor: pointer; box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); }

        /* 2. Tela do Mural */
        #id-tela-mural { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .topo-mural { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 24px; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; width: 100%; }
        .barra-pesquisa { width: 100%; max-width: 400px; padding: 12px 18px; border: 1px solid #475569; border-radius: 14px; background-color: #1e293b; color: #f8fafc; font-size: 0.95rem; outline: none; }
        .barra-pesquisa:focus { border-color: #38bdf8; }
        .btn-restrita { background-color: #1e293b; color: #e2e8f0; border: 1px solid #475569; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-voltar { background-color: transparent; color: #94a3b8; border: none; cursor: pointer; padding: 10px; font-size: 0.875rem; font-weight: 600; }

        /* Grid de Avisos */
        .grid-mural { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; width: 100%; }
        .card-aviso { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-corpo { padding: 20px; flex-grow: 1; }
        .card-titulo { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
        .card-conteudo { font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; }
        .card-data { padding: 16px 20px; font-size: 0.75rem; color: #38bdf8; border-top: 1px solid rgba(51, 65, 85, 0.5); }
        .card-vazio { grid-column: 1 / -1; text-align: center; padding: 80px 24px; background-color: rgba(30, 41, 59, 0.5); border-radius: 16px; border: 2px dashed #334155; }

        /* 3. Tela de Login e Cadastro */
        #id-tela-login { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 100; background-color: rgba(15, 23, 42, 0.97); padding: 16px; display: none; justify-content: center; align-items: center; }
        .box-login { background-color: #ffffff; padding: 32px; border-radius: 24px; width: 100%; max-width: 420px; color: #0f172a; box-shadow: 0 25px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .input-grupo { margin-bottom: 16px; text-align: left; width: 100%; }
        .input-grupo label { display: block; font-size: 0.875rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .input-grupo input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; font-size: 1rem; color: #0f172a; outline: none; }
        .btn-enviar { width: 100%; background-color: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-top: 8px; transition: background 0.2s; }
        .btn-enviar:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <!-- ==================== 1. TELA INICIAL ==================== -->
    <div id="id-tela-inicial" class="flex-center" style="position: fixed; inset: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #1d4ed8, #1e1b4b); padding: 24px; text-align: center; z-index: 50;">
        <div style="font-size: 5rem; margin-bottom: 24px;">📢</div>
        <h1 class="titulo-boas-vindas">Mural de Avisos</h1>
        <p class="subtitulo-boas-vindas">Acompanhe em tempo real todas as atualizações, eventos e comunicados importantes da nossa escola.</p>
        <button type="button" onclick="this.parentElement.style.setProperty('display', 'none', 'important'); document.getElementById('id-tela-mural').style.setProperty('display', 'block', 'important'); buscarAvisosDoBanco();" class="btn-laranja">
            Acessar Mural
        </button>
    </div>

    <!-- ==================== 2. TELA DO MURAL ==================== -->
    <div id="id-tela-mural" class="tela-sistema">
        <header class="topo-mural">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; color: white;">🏫 Mural Digital Escolar</h1>
                <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 4px;">Monitores e Celulares</p>
            </div>
            <input type="text" id="campo-busca" class="barra-pesquisa" placeholder="🔍 Pesquisar aviso específico..." oninput="filtrarAvisosNaTela()">
            <div style="display: flex; align-items: center; gap: 16px;">
                <button type="button" onclick="document.getElementById('id-tela-mural').style.setProperty('display', 'none', 'important'); document.getElementById('id-tela-login').style.setProperty('display', 'flex', 'important');" class="btn-restrita">⚙️ Área Restrita</button>
                <button type="button" onclick="irParaInicial()" class="btn-voltar">Voltar ↩</button>
            </div>
        </header>
        <main><div id="id-mural-container" class="grid-mural"></div></main>
    </div>

    <!-- ==================== 3. TELA DE LOGIN / CADASTRO ==================== -->
    <div id="id-tela-login" class="tela-sistema flex-center">
        
        <!-- Formulário de LOGIN -->
        <div id="box-login-container" class="box-login">
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 2.5rem;">🔐</span>
                <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Acesso Restrito</h2>
                <p style="color: #64748b; font-size: 0.875rem;">Docentes e Coordenação</p>
            </div>
            <form id="id-form-login-mural">
                <div class="input-grupo"><label>Usuário</label><input type="text" id="login-username" required></div>
                <div class="input-grupo"><label>Senha</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn-enviar">Entrar no Gerenciador</button>
            </form>
            <p style="text-align: center; font-size: 0.875rem; margin-top: 20px; color: #475569;">
                Novo? <button type="button" onclick="document.getElementById('box-login-container').style.setProperty('display', 'none', 'important'); document.getElementById('box-cadastro-container').style.setProperty('display', 'block', 'important');" style="color:#2563eb; font-weight:bold; background:none; border:none; cursor:pointer; text-decoration:underline;">Cadastre-se</button>
            </p>
            <button type="button" onclick="document.getElementById('id-tela-login').style.setProperty('display', 'none', 'important'); document.getElementById('id-tela-mural').style.setProperty('display', 'block', 'important');" class="btn-voltar" style="margin-top:20px; width:100%;">← Voltar ao Mural</button>
        </div>

        <!-- Formulário de CADASTRO (CORRIGIDO: Removido o campo secreto e alinhada a div externa para o botão verde aparecer) -->
        <div id="box-cadastro-container" class="box-login">
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 2.5rem;">👨‍🏫</span>
                <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Registro do Corpo Docente</h2>
            </div>
            <form id="id-form-cadastro-mural">
                <div class="input-grupo"><label>Usuário</label><input type="text" id="cad-username" required></div>
                <div class="input-grupo"><label>E-mail</label><input type="email" id="cad-email" required></div>
                <div class="input-grupo"><label>Senha</label><input type="password" id="cad-password" required></div>
                
                <!-- BOTÃO VERDE RECUPERADO COM SUCESSO -->
                <button type="submit" class="btn-enviar" style="background-color:#16a34a;">Validar e Cadastrar</button>
            </form>
