<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural de Avisos Escolares</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .flex-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 1. Tela Inicial */
        .tela-inicial {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            background: linear-gradient(135deg, #1d4ed8, #1e1b4b);
            padding: 24px;
            text-align: center;
        }

        .titulo-boas-vindas {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.05em;
        }

        .subtitulo-boas-vindas {
            color: #dbeafe;
            font-size: 1rem;
            max-width: 400px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-laranja {
            background-color: #f97316;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.125rem;
            padding: 16px 40px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
        }

        .btn-laranja:hover {
            background-color: #ea580c;
            transform: translateY(-2px);
        }

        /* 2. Tela do Mural */
        .tela-mural {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            z-index: 40;
        }

        .topo-mural {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* Input Estilizado da Barra de Pesquisa */
        .barra-pesquisa {
            width: 100%;
            max-width: 400px;
            padding: 12px 18px;
            border: 1px solid #475569;
            border-radius: 14px;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .barra-pesquisa:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .btn-restrita {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-restrita:hover {
            background-color: #334155;
        }

        .btn-voltar {
            background-color: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            padding: 10px;
            font-size: 0.875rem;
        }

        .btn-voltar:hover {
            color: #f1f5f9;
        }

        /* Grid Organizador de Avisos */
        .grid-mural {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card-aviso {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-imagem {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .card-corpo {
            padding: 20px;
            flex-grow: 1;
        }

        .card-titulo {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .card-conteudo {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .card-data {
            padding: 16px 20px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
            background-color: #1e293b;
        }

        .card-vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            background-color: rgba(30, 41, 59, 0.5);
            border-radius: 16px;
            border: 2px dashed #334155;
        }

        /* 3. Telas Modais de Login / Cadastro */
        .tela-login {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.96);
            padding: 16px;
        }

        .box-login {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            color: #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .input-grupo {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-grupo label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-grupo input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            font-size: 1rem;
            color: #0f172a;
        }

        .input-grupo input:focus {
            outline: 2px solid #2563eb;
        }

        .btn-enviar {
            width: 100%;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-enviar:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body class="flex-center">

    <!-- ==================== 1. TELA INICIAL (BOAS-VINDAS) ==================== -->
    <div id="id-tela-inicial" class="tela-inicial flex-center">
        <div style="font-size: 5rem; margin-bottom: 24px;">📢</div>
        <h1 class="titulo-boas-vindas">Mural de Avisos</h1>
        <p class="subtitulo-boas-vindas">
            Acompanhe em tempo real todas as atualizações, eventos e comunicados importantes da nossa escola.
        </p>
        <button type="button" onclick="document.getElementById('id-tela-inicial').style.display='none'; document.getElementById('id-tela-mural').style.display='block'; buscarAvisosDoBanco();" class="btn-laranja">
            Acessar Mural
        </button>
    </div>

    <!-- ==================== 2. TELA DO MURAL PÚBLICO (EXIBIÇÃO) ==================== -->
    <div id="id-tela-mural" class="tela-mural" style="display: none;">
        <header class="topo-mural">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; color: white;">🏫 Mural Digital Escolar</h1>
                <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 4px; margin-bottom: 12px;">Monitores e Celulares</p>
            </div>
            
            <!-- BARRA DE BUSCA EM TEMPO REAL -->
            <input type="text" id="campo-busca" class="barra-pesquisa" placeholder="🔍 Pesquisar aviso específico..." oninput="filtrarAvisosNaTela()">

            <div style="display: flex; align-items: center; gap: 12px;">
                <button type="button" onclick="document.getElementById('id-tela-login').style.display='flex'; alternarFormularios('login');" class="btn-restrita">⚙️ Área Restrita</button>
                <button type="button" onclick="voltarParaInicial()" class="btn-voltar">Voltar ↩</button>
            </div>
        </header>

        <main>
            <div id="id-mural-container" class="grid-mural">
                <div class="card-vazio">
                    <span style="font-size: 3rem; display: block; margin-bottom: 16px;">📭</span>
                    <p style="color: #94a3b8; font-size: 1.125rem;">Nenhum aviso ativo cadastrado pela coordenação.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ==================== 3. MODAL DE ACESSO ADMINISTRATIVO ==================== -->
    <div id="id-tela-login" class="tela-login flex-center" style="display: none;">
        
        <!-- Formulário de LOGIN -->
        <div id="box-login-container" class="box-login">
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 2.5rem;">🔐</span>
                <h2 style="font-size: 1.5rem; font-weight: 900; margin-top: 6px;">Acesso Restrito</h2>
                <p style="color: #64748b; font-size: 0.875rem;">Apenas professores, coordenadores e diretores autorizados</p>
            </div>
            
            <form id="id-form-login-mural">
                <div class="input-grupo">
                    <label>Nome de Usuário ou E-mail</label>
