<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos Escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container para armazenar os avisos em balões flutuantes na tela -->
    <div id="notification-container"></div>

    <div class="container">
        <div class="mural-header">
            <h2>📢 Mural Digital Informativo</h2>
            <div id="authActions">
                <a href="login.html" class="btn-primary" style="padding: 10px 24px; font-size: 1.05rem;">Área Restrita</a>
            </div>
        </div>

        <!-- Seção de publicação (Visível para Professores Autenticados) -->
        <div id="areaPublicar" class="form-container" style="display: none;">
            <h3>Nova Publicação</h3>
            <form id="formAviso" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Título do Aviso</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Digite um título claro...">
                </div>
                <div class="form-group">
                    <label>Conteúdo / Descrição</label>
                    <textarea id="conteudo" name="conteudo" rows="4" required placeholder="Escreva o comunicado aqui..."></textarea>
                </div>
                <div class="form-group">
                    <label>Imagem de Referência (Opcional)</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Publicar no Mural</button>
            </form>
        </div>

        <!-- NOVO: Barra de Busca Prática -->
        <div class="search-container">
            <input type="text" id="barraBusca" class="search-input" placeholder="🔍 Digite aqui para pesquisar um aviso específico...">
        </div>

        <!-- Exibição dos Avisos -->
        <div class="grid-avisos" id="muralGrid"></div>
    </div>

    <script>
        let usuarioLogado = false;
        let todosAvisos = []; // Guarda a lista completa vinda do banco de dados

        // Função de Notificação Customizada na Tela (Substitui o alert tradicional)
        function mostrarNotificacao(mensagem, tipo = 'success') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        async function checarLogin() {
            const res = await fetch('/api/usuario');
            const dados = await res.json();
            if (dados.logado) {
                usuarioLogado = true;
                document.getElementById('authActions').innerHTML = `
                    <span style="margin-right:20px; font-size: 1.2rem;">Olá, Professor(a) <b>${dados.nome}</b></span>
                    <button onclick="logout()" class="btn-delete">Sair</button>
                `;
                document.getElementById('areaPublicar').style.display = 'block';
            }
            carregarAvisos();
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.reload();
        }

        async function carregarAvisos() {
            const res = await fetch('/api/avisos');
            todosAvisos = await res.json();
            renderizarAvisos(todosAvisos);
        }

        // Desenha os avisos filtrados ou completos na tela
        function renderizarAvisos(listaDeAvisos) {
            const grid = document.getElementById('muralGrid');
            grid.innerHTML = '';

            if (listaDeAvisos.length === 0) {
                grid.innerHTML = `<p style="font-size: 1.3rem; color: #64748b; grid-column: 1/-1; text-align: center; margin-top: 20px;">Nenhum aviso encontrado.</p>`;
                return;
            }

            listaDeAvisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR');
                const imgTag = aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : '';
                
                // Opção de apagar o aviso visível para qualquer professor logado
                const btnDeletar = usuarioLogado ? `<button class="btn-delete" onclick="deletarAviso(${aviso.id})">Apagar</button>` : '';

                grid.innerHTML += `
                    <div class="card-aviso">
                        ${imgTag}
                        <div class="card-body">
                            <h3>${aviso.titulo}</h3>
                            <p>${aviso.conteudo}</p>
                        </div>
                        <div class="card-footer">
                            <span>Por: ${aviso.autor || 'Coordenação'} em ${dataFormatada}</span>
                            ${btnDeletar}
                        </div>
                    </div>
                `;
            });
        }

        // Sistema do filtro da barra de pesquisa em tempo real
        document.getElementById('barraBusca').addEventListener('input', (e) => {
            const termoBusca = e.target.value.toLowerCase();
            const avisosFiltrados = todosAvisos.filter(aviso => {
                return aviso.titulo.toLowerCase().includes(termoBusca) || 
                       aviso.conteudo.toLowerCase().includes(termoBusca);
            });
            renderizarAvisos(avisosFiltrados);
        });

        document.getElementById('formAviso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch('/api/avisos', {
                method: 'POST',
                body: formData
            });
            
            if (res.ok) {
                e.target.reset();
                mostrarNotificacao('Aviso publicado com sucesso!');
                carregarAvisos();
            } else {
                mostrarNotificacao('Erro ao publicar o seu aviso.', 'error');
            }
        });

        async function deletarAviso(id) {
            if (confirm('Deseja realmente excluir em definitivo este aviso do mural?')) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    mostrarNotificacao('O aviso selecionado foi removido!');
                    carregarAvisos();
                } else {
                    mostrarNotificacao('Falha ao tentar apagar o aviso.', 'error');
                }
            }
        }

        checarLogin();
    </script>
</body>
</html>
