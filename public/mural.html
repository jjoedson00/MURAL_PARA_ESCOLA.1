<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos Escolares</title>
    <!-- Adicionado ?v=2 para aplicar o tamanho esticado de ponta a ponta -->
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh;">
    
    <div id="notification-container"></div>

    <div class="container">
        <div class="mural-header">
            <h2>📢 Mural Digital Informativo</h2>
            <div id="authActions">
                <a href="login.html" class="btn-primary" style="padding: 12px 28px; font-size: 1.1rem;">Área Restrita</a>
            </div>
        </div>

        <div id="areaPublicar" class="form-container" style="display: none;">
            <h3>Nova Publicação</h3>
            <form id="formAviso" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Título do Aviso</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Digite um título claro...">
                </div>
                <div class="form-group">
                    <label>Conteúdo / Descrição</label>
                    <textarea id="conteudo" name="conteudo" rows="4" required placeholder="Escreva o comunicado aqui..."></textarea>
                </div>
                <div class="form-group">
                    <label>Imagem de Referência (Opcional)</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: center;">
                    <button type="submit" class="btn-primary">Publicar no Mural</button>
                    <button type="button" onclick="rolarParaMural()" class="btn-primary" style="background-color: #334155; box-shadow: 0 8px 25px rgba(51, 65, 85, 0.35);">Rolar para Avisos</button>
                    <button type="button" id="btnAlternarModo" onclick="alternarVisualizacao()" class="btn-primary" style="background-color: #475569; box-shadow: 0 8px 25px rgba(71, 85, 105, 0.35);">Ver como Aluno/Responsável</button>
                </div>
            </form>
        </div>

        <div class="search-container" id="secaoMural">
            <input type="text" id="barraBusca" class="search-input" placeholder="🔍 Digite aqui para pesquisar um aviso específico...">
        </div>

        <div class="grid-avisos" id="muralGrid"></div>
    </div>

    <script>
        let usuarioLogado = false;
        let todosAvisos = [];
        let modoAlunoAtivo = false;

        function mostrarNotificacao(mensagem, tipo = 'success') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        function rolarParaMural() {
            document.getElementById('secaoMural').scrollIntoView({ behavior: 'smooth' });
        }

            function alternarVisualizacao() {
            const area = document.getElementById('areaPublicar');
            const btn = document.getElementById('btnAlternarModo');
            
            if (!modoAlunoAtivo) {
                area.style.display = 'none';
                btn.innerText = 'Voltar para Modo Professor';
                btn.style.backgroundColor = '#ff8c00';
                modoAlunoAtivo = true;
                rolarParaMural();
            } else {
                area.style.display = 'block';
                btn.innerText = 'Ver como Aluno/Responsável';
                btn.style.backgroundColor = '#475569';
                modoAlunoAtivo = false;
            }
        }

        async function checarLogin() {
            const res = await fetch('/api/usuario');
            const dados = await res.json();
            if (dados.logado) {
                usuarioLogado = true;
                document.getElementById('authActions').innerHTML = `
                    <span style="margin-right:20px; font-size: 1.25rem; color: #1e3c72;">Olá, Professor(a) <b>${dados.nome}</b></span>
                    <button onclick="logout()" class="btn-delete">Sair</button>
                `;
                document.getElementById('areaPublicar').style.display = 'block';
            } else {
                usuarioLogado = false;
                document.getElementById('areaPublicar').style.display = 'none';
                document.getElementById('authActions').innerHTML = `
                    <a href="login.html" class="btn-primary" style="padding: 12px 28px; font-size: 1.1rem;">Área Restrita</a>
                `;
            }
            carregarAvisos();
        }

        async function logout() {
            const res = await fetch('/api/logout');
            if (res.ok) {
                mostrarNotificacao('Você saiu do sistema de publicação.', 'success');
                checarLogin(); 
            }
        }

        async function carregarAvisos() {
            const res = await fetch('/api/avisos');
            todosAvisos = await res.json();
            renderizarAvisos(todosAvisos);
        }

        function renderizarAvisos(listaDeAvisos) {
            const grid = document.getElementById('muralGrid');
            grid.innerHTML = '';

            if (listaDeAvisos.length === 0) {
                grid.innerHTML = `<p style="font-size: 1.4rem; color: #ffffff; grid-column: 1/-1; text-align: center; margin-top: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">Nenhum aviso encontrado no sistema.</p>`;
                return;
            }

            listaDeAvisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR');
                const imgTag = aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : '';
                const btnDeletar = (usuarioLogado && !modoAlunoAtivo) ? `<button class="btn-delete" onclick="deletarAviso(${aviso.id})">Apagar</button>` : '';

                grid.innerHTML += `
                    <div class="card-aviso">
                        ${imgTag}
                        <div class="card-body">
                            <h3>${aviso.titulo}</h3>
                            <p>${aviso.conteudo}</p>
                        </div>
                        <div class="card-footer">
                            <span>Por: ${aviso.autor || 'Coordenação'} em ${dataFormatada}</span>
                            ${btnDeletar}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('barraBusca').addEventListener('input', (e) => {
            const termoBusca = e.target.value.toLowerCase();
            const avisosFiltrados = todosAvisos.filter(aviso => {
                return aviso.titulo.toLowerCase().includes(termoBusca) || 
                       aviso.conteudo.toLowerCase().includes(termoBusca);
            });
            renderizarAvisos(avisosFiltrados);
        });

        document.getElementById('formAviso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/avisos', {
                    method: 'POST',
                    body: formData
                });
                
                const dados = await res.json();
                
                if (res.ok && dados.sucesso) {
                    e.target.reset();
                    mostrarNotificacao('Aviso publicado com sucesso!', 'success');
                    carregarAvisos();
                    setTimeout(rolarParaMural, 500);
                } else {
                    mostrarNotificacao(dados.erro || 'Erro ao publicar o seu aviso.', 'error');
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                mostrarNotificacao('Não foi possível conectar ao servidor.', 'error');
            }
        });

        async function deletarAviso(id) {
            if (confirm('Deseja realmente excluir este aviso?')) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    mostrarNotificacao('O aviso foi removido!', 'success');
                    carregarAvisos();
                } else {
                    mostrarNotificacao('Falha ao tentar apagar.', 'error');
                }
            }
        }

        checarLogin();
    </script>
</body>
</html>
