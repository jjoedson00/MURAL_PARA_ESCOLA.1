<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mural Digital</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="pagina-mural">

<header class="mural-header">
<div>
<h1>📌 Mural Digital</h1>
<p>Informações e avisos da escola</p>
</div>

<div class="mural-acoes">
<button id="btn-notificacoes">🔔 Ativar notificações</button>
<button id="btn-instalar" style="display:none;" onclick="instalarApp()">📲 Instalar na tela inicial</button>
<a href="login.html">Acesso Professor</a>
</div>
</header>

<main class="mural-main">

<div class="mural-topo">
<div>
<h2>Avisos</h2>
<span class="status-atualizacao">● Atualização Automática</span>
</div>

<input
type="search"
id="pesquisa"
placeholder="Pesquisar avisos por título ou conteúdo..."
>
</div>

<p id="mensagem-mural"></p>

<div id="lista-avisos"></div>

</main>

<script>
let avisosAtuais=[];

function mostrarMensagem(texto,cor='#15803d'){
const mensagem=document.getElementById('mensagem-mural');
mensagem.textContent=texto;
mensagem.style.color=cor;
}

async function carregarAvisos(){
try{
const resposta=await fetch('/api/avisos');
const avisos=await resposta.json();

if(!resposta.ok){
mostrarAvisos([]);
return;
}

avisosAtuais=avisos;
mostrarAvisos(avisos);

}catch(erro){
console.error(erro);
mostrarAvisos([]);
}
}

function mostrarAvisos(avisos){
const lista=document.getElementById('lista-avisos');
lista.innerHTML='';

if(!avisos.length){
lista.innerHTML='<p class="mensagem-vazia">Nenhum aviso encontrado.</p>';
return;
}

avisos.forEach(aviso=>{

const prioridadeTexto=String(
aviso.prioridade||
aviso.cor_destaque||
'Normal'
).trim();

let prioridadeClasse='normal';

if(prioridadeTexto.toLowerCase()==='importante'){
prioridadeClasse='importante';
}else if(prioridadeTexto.toLowerCase()==='urgente'){
prioridadeClasse='urgente';
}

const card=document.createElement('div');
card.className='aviso-card '+prioridadeClasse;

const titulo=document.createElement('h3');
titulo.textContent=aviso.titulo;

const prioridadeElemento=document.createElement('span');
prioridadeElemento.className='prioridade '+prioridadeClasse;
prioridadeElemento.textContent=prioridadeTexto;

if(aviso.imagem){
const imagem=document.createElement('img');
imagem.src=aviso.imagem;
imagem.alt='Imagem do aviso';
imagem.className='imagem-aviso';
card.appendChild(titulo);
card.appendChild(imagem);
}else{
card.appendChild(titulo);
}

const conteudo=document.createElement('p');
conteudo.textContent=aviso.conteudo;

const info=document.createElement('div');
info.className='aviso-info';

const autor=document.createElement('span');
autor.textContent='✍️ '+(aviso.autor||'Professor');

const data=document.createElement('span');
data.textContent=aviso.data_criacao
?new Date(aviso.data_criacao).toLocaleString('pt-BR')
:'';

info.appendChild(autor);
info.appendChild(data);

card.appendChild(conteudo);
card.appendChild(info);
card.appendChild(prioridadeElemento);

lista.appendChild(card);
});
}

document.getElementById('pesquisa').addEventListener('input',function(){
const texto=this.value.toLowerCase().trim();

const filtrados=avisosAtuais.filter(aviso=>
String(aviso.titulo||'').toLowerCase().includes(texto)||
String(aviso.conteudo||'').toLowerCase().includes(texto)
);

mostrarAvisos(filtrados);
});

const mensagemSalva=sessionStorage.getItem('mensagemMural');

if(mensagemSalva){
mostrarMensagem(mensagemSalva);
sessionStorage.removeItem('mensagemMural');

setTimeout(()=>{
document.getElementById('mensagem-mural').textContent='';
},4000);
}

carregarAvisos();

setInterval(carregarAvisos,10000);


/* NOTIFICAÇÕES */

let registroServiceWorker=null;

function urlBase64ToUint8Array(base64String){
const padding='='.repeat((4-base64String.length%4)%4);
const base64=(base64String+padding)
.replace(/-/g,'+')
.replace(/_/g,'/');

const rawData=atob(base64);

return Uint8Array.from(
[...rawData].map(char=>char.charCodeAt(0))
);
}

async function configurarNotificacoes(){

const botao=document.getElementById('btn-notificacoes');

if(
!('serviceWorker' in navigator)||
!('PushManager' in window)||
!('Notification' in window)
){
botao.textContent='🔔 Notificações não disponíveis';
return;
}

try{

registroServiceWorker=
await navigator.serviceWorker.register('/service-worker.js');

registroServiceWorker=
await navigator.serviceWorker.ready;

const subscription=
await registroServiceWorker.pushManager.getSubscription();

if(subscription){
botao.textContent='🔔 Notificações ativadas';
}

}catch(erro){

console.error(
'Erro ao configurar notificações:',
erro
);

botao.textContent='🔔 Notificações não disponíveis';
}
}

document.getElementById('btn-notificacoes').addEventListener('click',async()=>{

const botao=document.getElementById('btn-notificacoes');

try{

if(!registroServiceWorker){
await configurarNotificacoes();
}

if(!registroServiceWorker){
mostrarMensagem(
'Não foi possível preparar as notificações.',
'#dc2626'
);
return;
}

if(Notification.permission==='denied'){
mostrarMensagem(
'As notificações estão bloqueadas neste dispositivo. Ative a permissão nas configurações do navegador.',
'#dc2626'
);
return;
}

const permissao=
await Notification.requestPermission();

if(permissao!=='granted'){
mostrarMensagem(
'Permissão para notificações não concedida.',
'#dc2626'
);
return;
}

let subscription=
await registroServiceWorker.pushManager.getSubscription();

if(!subscription){

const respostaChave=
await fetch('/api/notificacoes/chave-publica');

if(!respostaChave.ok){
throw new Error(
'Não foi possível obter a chave pública VAPID.'
);
}

const dadosChave=
await respostaChave.json();

if(!dadosChave.chavePublica){
throw new Error(
'Chave pública VAPID não encontrada.'
);
}

const chaveUint8Array=
urlBase64ToUint8Array(
dadosChave.chavePublica
);

subscription=
await registroServiceWorker.pushManager.subscribe({
userVisibleOnly:true,
applicationServerKey:chaveUint8Array
});
}

const resposta=
await fetch('/api/notificacoes/inscrever',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(subscription)
});

const dados=await resposta.json();

if(!resposta.ok){
throw new Error(
dados.erro||
'Erro ao registrar notificações.'
);
}

botao.textContent='🔔 Notificações ativadas';

mostrarMensagem(
'Notificações ativadas com sucesso!',
'#15803d'
);

}catch(erro){

console.error(
'Erro ao ativar notificações:',
erro
);

mostrarMensagem(
'Não foi possível ativar as notificações.',
'#dc2626'
);
}
});

configurarNotificacoes();


/* INSTALAÇÃO */

let deferredPrompt=null;

window.addEventListener('beforeinstallprompt',event=>{
event.preventDefault();
deferredPrompt=event;
document.getElementById('btn-instalar').style.display='block';
});

async function instalarApp(){

if(!deferredPrompt)return;

deferredPrompt.prompt();

await deferredPrompt.userChoice;

deferredPrompt=null;

document.getElementById('btn-instalar').style.display='none';
}

window.addEventListener('appinstalled',()=>{
document.getElementById('btn-instalar').style.display='none';
});
</script>

</body>
</html>
