<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mural Digital</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body class="pagina-mural">

<header class="mural-header">
<div>
<h1>📌 Mural Digital</h1>
<p>Comunicados e avisos da escola</p>
</div>

<div class="mural-acoes">
<button id="btn-notificacoes">🔔 Ativar notificações</button>
<button id="btn-instalar" style="display:none;" onclick="instalarApp()">📲 Instalar na tela inicial</button>
<a href="login.html">Acesso Professor</a>
</div>
</header>

<main class="mural-main">

<div class="mural-topo">
<div>
<h2>Avisos</h2>
<span class="status-atualizacao">● Atualização Automática</span>
</div>

<input
type="search"
id="pesquisa"
placeholder="Pesquisar avisos por título ou conteúdo"
>
</div>

<p id="mensagem-mural"></p>

<div id="lista-avisos"></div>

</main>

<script>
const listaAvisos=document.getElementById('lista-avisos');
const pesquisa=document.getElementById('pesquisa');
const mensagemMural=document.getElementById('mensagem-mural');
const botaoNotificacoes=document.getElementById('btn-notificacoes');

let todosAvisos=[];
let eventoInstalacao=null;

function mostrarMensagem(texto,cor='#15803d'){
mensagemMural.textContent=texto;
mensagemMural.style.color=cor;

setTimeout(()=>{
mensagemMural.textContent='';
},4000);
}

const mensagemSalva=sessionStorage.getItem('mensagemMural');

if(mensagemSalva){
mostrarMensagem(mensagemSalva);
sessionStorage.removeItem('mensagemMural');
}

async function carregarAvisos(){
try{
const resposta=await fetch('/api/avisos');

if(!resposta.ok)throw new Error('Erro ao carregar avisos.');

todosAvisos=await resposta.json();
mostrarAvisos(todosAvisos);

}catch(erro){
console.error(erro);
listaAvisos.innerHTML=
'<p class="mensagem-erro">Não foi possível carregar os avisos.</p>';
}
}

function mostrarAvisos(avisos){
const termo=pesquisa.value.trim().toLowerCase();

const filtrados=avisos.filter(aviso=>{
const titulo=String(aviso.titulo||'').toLowerCase();
const conteudo=String(aviso.conteudo||'').toLowerCase();

return titulo.includes(termo)||conteudo.includes(termo);
});

if(filtrados.length===0){
listaAvisos.innerHTML=
'<p class="mensagem-vazia">Nenhum aviso encontrado.</p>';
return;
}

listaAvisos.innerHTML='';

filtrados.forEach(aviso=>{
const card=document.createElement('article');
card.className='aviso-card';

const prioridade=
aviso.cor_destaque||
aviso.prioridade||
'Normal';

const titulo=document.createElement('h3');
titulo.textContent=aviso.titulo||'Sem título';

const conteudo=document.createElement('p');
conteudo.textContent=aviso.conteudo||'';

const info=document.createElement('div');
info.className='aviso-info';

const autor=document.createElement('span');
autor.textContent='✍️ '+(aviso.autor||'Professor');

const data=document.createElement('span');

if(aviso.data_criacao){
const dataFormatada=new Date(aviso.data_criacao);

data.textContent=
'📅 '+dataFormatada.toLocaleDateString('pt-BR');
}

info.appendChild(autor);
info.appendChild(data);

const prioridadeElemento=document.createElement('span');
prioridadeElemento.className='prioridade';
prioridadeElemento.textContent=prioridade;

card.appendChild(titulo);
card.appendChild(conteudo);

if(aviso.imagem){
const imagem=document.createElement('img');
imagem.src=aviso.imagem;
imagem.alt='Imagem do aviso';
imagem.className='imagem-aviso';

card.appendChild(imagem);
}

card.appendChild(info);
card.appendChild(prioridadeElemento);

listaAvisos.appendChild(card);
});
}

pesquisa.addEventListener('input',()=>{
mostrarAvisos(todosAvisos);
});

carregarAvisos();

setInterval(()=>{
carregarAvisos();
},10000);

async function configurarNotificacoes(){
if(
!('serviceWorker'in navigator)||
!('PushManager'in window)||
!('Notification'in window)
){
botaoNotificacoes.textContent='🔔 Notificações não disponíveis';
botaoNotificacoes.disabled=true;
return;
}

try{
const registro=await navigator.serviceWorker.register('/service-worker.js');

const resposta=await fetch('/api/notificacoes/chave-publica');

const dados=await resposta.json();

const chavePublica=dados.chavePublica;

let inscricao=
await registro.pushManager.getSubscription();

if(inscricao){
try{
await inscricao.unsubscribe();
}catch(erro){
console.error(
'Erro ao renovar inscrição:',
erro
);
}
}

inscricao=await registro.pushManager.subscribe({
userVisibleOnly:true,
applicationServerKey:converterChave(chavePublica)
});

await fetch('/api/notificacoes/inscrever',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(inscricao)
});

botaoNotificacoes.textContent='🔄 Renovar notificações';

}catch(erro){
console.error(
'Erro ao configurar notificações:',
erro
);
}
}

botaoNotificacoes.addEventListener('click',async()=>{
if(
!('serviceWorker'in navigator)||
!('PushManager'in window)||
!('Notification'in window)
){
botaoNotificacoes.textContent='🔔 Notificações não disponíveis';
return;
}

try{
const permissao=await Notification.requestPermission();

if(permissao!=='granted'){
mostrarMensagem(
'Permissão para notificações não concedida.',
'#dc2626'
);
return;
}

await configurarNotificacoes();

mostrarMensagem(
'🔔 Notificações ativadas com sucesso!'
);

}catch(erro){
console.error(erro);

mostrarMensagem(
'Não foi possível ativar as notificações.',
'#dc2626'
);
}
});

function converterChave(base64){
const padding='='.repeat(
(4-base64.length%4)%4
);

const base64Final=
(base64+padding)
.replace(/-/g,'+')
.replace(/_/g,'/');

const rawData=window.atob(base64Final);

return Uint8Array.from(
[...rawData].map(char=>char.charCodeAt(0))
);
}

window.addEventListener('beforeinstallprompt',event=>{
event.preventDefault();

eventoInstalacao=event;

const botao=document.getElementById('btn-instalar');

if(botao){
botao.style.display='inline-flex';
}
});

async function instalarApp(){
if(!eventoInstalacao)return;

eventoInstalacao.prompt();

const resultado=
await eventoInstalacao.userChoice;

if(resultado.outcome==='accepted'){
const botao=document.getElementById('btn-instalar');

if(botao){
botao.style.display='none';
}
}

eventoInstalacao=null;
}

window.addEventListener('appinstalled',()=>{
const botao=document.getElementById('btn-instalar');

if(botao){
botao.style.display='none';
}
});

if(
window.matchMedia('(display-mode: standalone)').matches||
window.navigator.standalone===true
){
const botao=document.getElementById('btn-instalar');

if(botao){
botao.style.display='none';
}
}

</script>

</body>
</html>
