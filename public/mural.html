<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Digital Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Topo do Sistema -->
    <header>
        <div class="logo-area">
            <span class="icon">📢</span>
            <h1>Mural Digital</h1>
        </div>
        <div id="auth-controls">
            <a href="login.html" class="btn-primary">Acesso Professor</a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <!-- Painel de Publicação (Visível apenas após login) -->
        <section id="painel-admin" class="hidden">
            <div class="card-admin">
                <h2>Nova Publicação</h2>
                <form id="form-aviso" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="titulo">Título do Aviso</label>
                        <input type="text" id="titulo" name="titulo" required placeholder="Ex: Reunião de Pais">
                    </div>
                    <div class="form-group">
                        <label for="conteudo">Conteúdo / Descrição</label>
                        <textarea id="conteudo" name="conteudo" rows="3" required placeholder="Digite os detalhes do comunicado..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="imagem" class="custom-file-upload">
                            📷 Adicionar Imagem de Referência
                        </label>
                        <input type="file" id="imagem" name="imagem" accept="image/*">
                        <span id="file-name">Nenhum arquivo selecionado</span>
                    </div>
                    <button type="submit" class="btn-success">Publicar no Mural</button>
                </form>
            </div>
        </section>

        <!-- 🔍 BARRA DE PESQUISA PARA PAIS E ALUNOS -->
        <section class="search-section">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="busca-aviso" placeholder="Pesquisar avisos por título ou conteúdo...">
            </div>
        </section>

        <!-- Visualização Pública dos Cards -->
        <section id="mural-publico">
            <div class="mural-header">
                <h2>Avisos Recentes</h2>
                <div id="live-indicator"><span class="dot"></span> Atualização Automática</div>
            </div>
            
            <!-- Container totalmente limpo de posts falsos -->
            <div id="container-avisos" class="grid-avisos">
                <p class="loading">Carregando avisos...</p>
            </div>
        </section>
    </main>

    <!-- Lógica de Funcionamento integrada diretamente na página -->
    <script>
        let listaDeAvisos = [];

        document.addEventListener("DOMContentLoaded", () => {
            verificarLogin();
            carregarAvisos();
            setInterval(carregarAvisos, 30000);

            // Filtro da barra de busca
            const campoBusca = document.getElementById("busca-aviso");
            if (campoBusca) {
                campoBusca.addEventListener("input", (e) => {
                    const termo = e.target.value.toLowerCase();
                    const filtrados = listaDeAvisos.filter(aviso => 
                        aviso.titulo.toLowerCase().includes(termo) || 
                        aviso.conteudo.toLowerCase().includes(termo)
                    );
                    renderizarAvisos(filtrados);
                });
            }

            // Controle do formulário de avisos
            const formAviso = document.getElementById("form-aviso");
            if (formAviso) {
                formAviso.addEventListener("submit", async function(e) {
                    e.preventDefault();
                    const formData = new FormData(this);
                    const res = await fetch('/api/avisos', { method: 'POST', body: formData });
                    const data = await res.json();

                    if(data.sucesso) {
                        this.reset();
                        document.getElementById("file-name").innerText = "Nenhum arquivo selecionado";
                        carregarAvisos();
                    } else {
                        alert(data.erro || "Erro ao publicar");
                    }
                });

                document.getElementById("imagem").addEventListener("change", (e) => {
                    const name = e.target.files.length > 0 ? e.target.files.name : "Nenhum arquivo selecionado";
                    document.getElementById("file-name").innerText = name;
                });
            }
        });

        async function verificarLogin() {
            try {
                const res = await fetch('/api/usuario');
                const data = await res.json();
                const authControls = document.getElementById("auth-controls");
                const painelAdmin = document.getElementById("painel-admin");

                if (data.logado) {
                    if (painelAdmin) painelAdmin.classList.remove("hidden");
                    authControls.innerHTML = `<span>Olá, <strong>${data.nome}</strong></span> <button onclick="fazerLogout()" class="btn-danger" style="margin-left:10px; padding: 0.5rem 1rem; font-size: 0.9rem;">Sair</button>`;
                }
            } catch (e) { console.log("Aguardando conexão com o servidor..."); }
        }

        async function carregarAvisos() {
            try {
                const res = await fetch('/api/avisos');
                listaDeAvisos = await res.json();
                renderizarAvisos(listaDeAvisos);
            } catch (err) {
                renderizarAvisos([]);
            }
        }

        function renderizarAvisos(avisos) {
            const container = document.getElementById("container-avisos");
            if (!container) return;
            container.innerHTML = "";

            if (avisos.length === 0) {
                container.innerHTML = "<p class='loading'>Nenhum comunicado ativo no momento.</p>";
                return;
            }

            avisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit'
                });

                const card = document.createElement("div");
                card.className = "card-aviso";
                card.innerHTML = `
                    ${aviso.imagem ? `<img src="${aviso.imagem}" class="aviso-img" alt="Foto de Referência">` : ''}
                    <div class="aviso-body">
                        <h3>${aviso.titulo}</h3>
                        <p>${aviso.conteudo}</p>
                    </div>
                    <div class="aviso-footer">
                        <span class="aviso-meta">Por: ${aviso.autor || 'Coordenação'} <br> 🕒 ${dataFormatada}</span>
                        ${document.getElementById("painel-admin").classList.contains("hidden") ? '' : `<button onclick="deletarAviso(${aviso.id})" class="btn-danger" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Apagar</button>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function deletarAviso(id) {
            if(confirm("Deseja apagar este aviso?")) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if(data.sucesso) carregarAvisos();
            }
        }

        async function fazerLogout() {
            await fetch('/api/logout');
            window.location.reload();
        }
    </script>
</body>
</html>
