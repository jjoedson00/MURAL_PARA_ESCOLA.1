<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Digital</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #container-avisos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            padding-top: 20px;
        }

        .aviso-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            background-color: white;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .aviso-card:hover { transform: translateY(-2px); }

        /* AJUSTE DA IMAGEM: Aumentada de 180px para 320px para melhor destaque no mural */
        .aviso-imagem-container {
            width: 100%;
            height: 320px; 
            overflow: hidden;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }

        .aviso-imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .aviso-conteudo-box {
            padding: 22px;
            flex-grow: 1;
            color: white;
        }

        .aviso-card.normal-bg .aviso-conteudo-box { color: #1e293b; }

        .aviso-titulo { font-size: 20px; font-weight: bold; margin: 0 0 12px 0; text-transform: capitalize; }
        .aviso-texto { font-size: 15px; margin: 0; opacity: 0.95; line-height: 1.5; }

        .aviso-footer {
            background-color: #f8fafc;
            padding: 14px 22px;
            border-top: 1px solid #f1f5f9;
            font-size: 13px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .aviso-autor-tag { font-weight: 600; color: #334155; background: #e2e8f0; padding: 4px 10px; border-radius: 20px; font-size: 11px; }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px;">
        <h2>📌 Mural Digital</h2>
        <a href="/login.html" style="text-decoration: none;">
            <button style="background: #1e293b; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Acesso Professor</button>
        </a>
    </header>

    <main style="padding: 20px;">
        <div style="margin-bottom: 20px;">
            <input type="text" id="input-pesquisa" placeholder="🔍 Pesquisar avisos por título ou conteúdo..." style="width: 100%; padding: 15px; border-radius: 30px; border: 1px solid #e2e8f0;">
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h3>Avisos Recentes</h3>
            <span style="color: #10b981;">● Atualização Automática</span>
        </div>

        <div id="container-avisos"></div>
    </main>

    <script>
        async function carregarAvisos() {
            try {
                const resposta = await fetch('/api/avisos'); 
                if (!resposta.ok) throw new Error('Erro ao buscar dados');
                const avisos = await resposta.json();
                renderizarAvisos(avisos);
            } catch (erro) { console.error("Erro de conexão:", erro); }
        }

        function renderizarAvisos(avisos) {
            const container = document.getElementById("container-avisos");
            if (!container) return;
            container.innerHTML = "";

            if (!avisos || avisos.length === 0) {
                container.innerHTML = "<p style='text-align: center; color: #64748b; margin-top: 20px;'>Nenhum comunicado ativo no momento.</p>";
                return;
            }

            avisos.forEach(aviso => {
                const dataBanco = aviso.data_criacao || aviso.data;
                const dataFormatada = dataBanco 
                    ? new Date(dataBanco).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' })
                    : new Date().toLocaleDateString('pt-BR');

                let corFundo = '#ffffff'; 
                let classeTexto = 'normal-bg';

                if (aviso.prioridade === 'Importante') { corFundo = '#eab308'; classeTexto = ''; }
                else if (aviso.prioridade === 'Urgente') { corFundo = '#ef4444'; classeTexto = ''; }

                const card = document.createElement("div");
                card.className = `aviso-card ${classeTexto}`;
                
                const imagemHtml = aviso.imagem 
                    ? `<div class="aviso-imagem-container"><img src="/uploads/${aviso.imagem}" alt="Imagem do aviso"></div>` 
                    : '';

                card.innerHTML = `
                    ${imagemHtml}
                    <div class="aviso-conteudo-box" style="background-color: ${corFundo};">
                        <h3 class="aviso-titulo">${aviso.titulo}</h3>
                        <p class="aviso-texto">${aviso.conteudo}</p>
                    </div>
                    <div class="aviso-footer">
                        <span>🕒 ${dataFormatada}</span>
                        <!-- EXIBIÇÃO DA ASSINATURA DINÂMICA -->
                        <span class="aviso-autor-tag">✍️ ${aviso.autor}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('input-pesquisa').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.aviso-card');
            cards.forEach(card => {
                const titulo = card.querySelector('.aviso-titulo').textContent.toLowerCase();
                const texto = card.querySelector('.aviso-texto').textContent.toLowerCase();
                card.style.display = (titulo.includes(termo) || texto.includes(termo)) ? 'flex' : 'none';
            });
        });

        document.addEventListener("DOMContentLoaded", carregarAvisos);
    </script>
</body>
</html>
