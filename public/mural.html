<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Escolar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mensagem-postagem {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            display: none; 
        }
        .sucesso-postagem { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .erro-postagem { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <nav class="navbar">
        <h2>Mural de Avisos Digitais</h2>
        <div class="nav-actions" id="navActions">
            <button onclick="irParaOsAvisos()" class="btn-secundary">🔄 Ver Mural (Atualizar)</button>
            <a href="login.html" class="btn-secundary">Acesso Administrativo</a>
        </div>
    </nav>

    <div class="mural-container-gigante">
        
        <!-- Área de Publicação Gigante -->
        <div id="areaCriacao" class="painel-publicacao-gigante" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 style="margin-bottom: 0;">Publicar Novo Aviso</h3>
                <button onclick="limparTodoOMural()" class="btn-delete-professor" style="background-color: #bb2d3b !important;">🗑️ Limpar Todo o Mural</button>
            </div>
            
            <div id="mensagemFeedbackAviso" class="mensagem-postagem"></div>

            <form id="avisoForm" enctype="multipart/form-data">
                <div class="campo-grupo-gigante">
                    <label>Título do Aviso</label>
                    <input type="text" id="tituloAviso" name="titulo" placeholder="Digite um título bem visível" required>
                </div>
                <div class="campo-grupo-gigante">
                    <label>Conteúdo / Texto do Comunicado</label>
                    <textarea id="conteudoAviso" name="conteudo" rows="5" placeholder="Escreva os detalhes do aviso aqui..." required></textarea>
                </div>
                <div class="campo-grupo-gigante">
                    <label>Imagem de Referência (Opcional)</label>
                    <input type="file" id="imagemAviso" name="imagem" accept="image/*">
                </div>
                <button type="submit" class="btn-postar-gigante">Postar no Mural</button>
            </form>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="search-container" id="ancoraPesquisa">
            <input type="text" id="campoPesquisa" class="search-input" placeholder="🔍 Pesquisar avisos por título ou conteúdo...">
        </div>

        <!-- Grid de Avisos -->
        <div class="grid-avisos-gigante" id="muralGrid">
            <!-- Os cards entram aqui via JS -->
        </div>
    </div>

    <script>
        let usuarioLogado = false;
        let todosOsAvisos = [];

        async function checarStatus() {
            try {
                const res = await fetch('/api/usuario-atual');
                const status = await res.json();
                
                const navActions = document.getElementById('navActions');
                const areaCriacao = document.getElementById('areaCriacao');

                if (status.logado) {
                    usuarioLogado = true;
                    areaCriacao.style.display = 'block'; 
                    navActions.innerHTML = `
                        <button onclick="irParaOsAvisos()" class="btn-secundary">📋 Voltar para o Mural</button>
                        <span style="color: white; font-weight: bold; margin-left: 10px;">Prof. ${status.nome}</span>
                        <button onclick="logout()" class="btn-secundary" style="background:#dc3545; border:none; margin-left:10px;">Sair</button>
                    `;
                }
            } catch (err) {
                console.error(err);
            }
            carregarAvisos();
        }

        function irParaOsAvisos() {
            carregarAvisos();
            const elementoAlvo = document.getElementById('ancoraPesquisa');
            if (elementoAlvo) {
                elementoAlvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function carregarAvisos() {
            try {
                const res = await fetch('/api/avisos');
                todosOsAvisos = await res.json();
                exibirAvisos(todosOsAvisos);
            } catch (err) {
                console.error(err);
            }
        }

        function exibirAvisos(listaDeAvisos) {
            const grid = document.getElementById('muralGrid');
            grid.innerHTML = '';

            if (!listaDeAvisos || listaDeAvisos.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#666; font-size: 1.4rem; grid-column: 1/-1; padding: 40px 0;">Nenhum aviso publicado no momento.</p>';
                return;
            }

            listaDeAvisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR');
                const card = document.createElement('div');
                card.className = 'card-aviso-gigante';
                
                card.innerHTML = `
                    ${aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : ''}
                    <div class="card-body-gigante">
                        <h3>${aviso.titulo}</h3>
                        <p>${aviso.conteudo}</p>
                        <div class="card-footer-gigante">
                            <span>Postado em: ${dataFormatada}</span>
                            ${usuarioLogado ? `<button class="btn-delete-professor" onclick="deletarAviso(${aviso.id})">🗑️ Apagar Aviso</button>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('campoPesquisa').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            const filtrados = todosOsAvisos.filter(aviso => 
                aviso.titulo.toLowerCase().includes(termo) || aviso.conteudo.toLowerCase().includes(termo)
            );
            exibirAvisos(filtrados);
        });

        document.getElementById('avisoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const caixaMensagem = document.getElementById('mensagemFeedbackAviso');

            caixaMensagem.style.display = 'none';

            try {
                const res = await fetch('/api/avisos', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    e.target.reset(); 
                    caixaMensagem.textContent = '🎉 Aviso publicado com sucesso no mural!';
                    caixaMensagem.className = 'mensagem-postagem sucesso-postagem';
                    caixaMensagem.style.display = 'block';
                    
                    carregarAvisos();

                    setTimeout(() => {
                        caixaMensagem.style.display = 'none';
                    }, 4000);
                } else {
                    caixaMensagem.textContent = '❌ Erro ao salvar o aviso no banco de dados.';
                    caixaMensagem.className = 'mensagem-postagem erro-postagem';
                    caixaMensagem.style.display = 'block';
                }
            } catch {
                caixaMensagem.textContent = '❌ Erro ao se conectar com o servidor.';
                caixaMensagem.className = 'mensagem-postagem erro-postagem';
                caixaMensagem.style.display = 'block';
            }
        });

        async function deletarAviso(id) {
            if (confirm('Deseja apagar permanentemente este aviso do mural?')) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                if (res.ok) carregarAvisos();
            }
        }

        async function limparTodoOMural() {
            if (confirm('⚠️ ATENÇÃO: Tem certeza de que deseja apagar absolutamente TODOS os avisos e imagens do mural escolar?')) {
                const res = await fetch('/api/limpar-mural', { method: 'DELETE' });
                if (res.ok) carregarAvisos();
            }
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.reload();
        }

        checarStatus();
        setInterval(carregarAvisos, 30000);
    </script>
</body>
</html>
