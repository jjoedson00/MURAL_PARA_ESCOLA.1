
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural Digital</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pagina-mural">
<header class="mural-header">
<h2>📌 Mural Digital</h2>
<div class="mural-acoes">
<button type="button" id="btn-notificacoes" class="botao-notificacoes">🔔 Ativar notificações</button>
<a href="/admin.html" class="botao-professor">Acesso Professor</a>
</div>
</header>
<main class="mural-main">
<div id="mensagem-mural"></div>
<div class="pesquisa-container">
<input type="text" id="input-pesquisa" placeholder="🔍 Pesquisar avisos por título ou conteúdo...">
</div>
<div class="mural-titulo">
<h3>Avisos Recentes</h3>
<span class="atualizacao">● Atualização Automática</span>
</div>
<div id="container-avisos">
<p class="sem-avisos">Carregando avisos...</p>
</div>
</main>
<script>
let registroServiceWorker=null;
let avisosAtuais=[];
async function carregarAvisos(){
try{
const resposta=await fetch('/api/avisos',{method:'GET',cache:'no-store'});
if(!resposta.ok)throw new Error('Erro ao buscar dados');
const avisos=await resposta.json();
avisosAtuais=avisos;
renderizarAvisos(avisos);
}catch(erro){
console.error('Erro de conexão:',erro);
const container=document.getElementById('container-avisos');
if(container&&avisosAtuais.length===0)container.innerHTML='<p class="sem-avisos">Não foi possível carregar os avisos. Tente novamente.</p>';
}}
function renderizarAvisos(avisos){
const container=document.getElementById('container-avisos');
if(!container)return;
container.innerHTML='';
if(!avisos||avisos.length===0){
container.innerHTML='<p class="sem-avisos">Nenhum comunicado ativo no momento.</p>';
return;
}
avisos.forEach(aviso=>{
const dataBanco=aviso.data_criacao||aviso.data;
const dataFormatada=dataBanco?new Date(dataBanco).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}):new Date().toLocaleDateString('pt-BR');
let corFundo='#ffffff';
let classeTexto='normal-bg';
if(aviso.prioridade==='Importante'){
corFundo='#eab308';
classeTexto='';
}else if(aviso.prioridade==='Urgente'){
corFundo='#ef4444';
classeTexto='';
}
const card=document.createElement('div');
card.className=`aviso-card ${classeTexto}`;
let imagem=aviso.imagem||null;
if(imagem&&!imagem.startsWith('http')&&!imagem.startsWith('/uploads/'))imagem='/uploads/'+imagem;
const imagemHtml=imagem?`<div class="aviso-imagem-container"><img src="${imagem}" alt="Imagem do aviso" loading="lazy"></div>`:'';
card.innerHTML=`
${imagemHtml}
<div class="aviso-conteudo-box" style="background-color:${corFundo};">
<h3 class="aviso-titulo">${aviso.titulo}</h3>
<p class="aviso-texto">${aviso.conteudo}</p>
</div>
<div class="aviso-footer">
<span>🕒 ${dataFormatada}</span>
<span class="aviso-autor-tag">✍️ ${aviso.autor}</span>
</div>`;
container.appendChild(card);
});
aplicarPesquisa();
}
function aplicarPesquisa(){
const termo=document.getElementById('input-pesquisa').value.toLowerCase().trim();
document.querySelectorAll('.aviso-card').forEach(card=>{
const titulo=card.querySelector('.aviso-titulo').textContent.toLowerCase();
const texto=card.querySelector('.aviso-texto').textContent.toLowerCase();
card.style.display=titulo.includes(termo)||texto.includes(termo)?'flex':'none';
});
}
document.getElementById('input-pesquisa').addEventListener('input',aplicarPesquisa);
function mostrarMensagem(){
const mensagem=sessionStorage.getItem('mensagemMural');
if(!mensagem)return;
const container=document.getElementById('mensagem-mural');
container.innerHTML=`<div class="mensagem-sucesso">✅ ${mensagem}</div>`;
sessionStorage.removeItem('mensagemMural');
setTimeout(()=>{
const elemento=document.querySelector('.mensagem-sucesso');
if(elemento){
elemento.classList.add('sumindo');
setTimeout(()=>elemento.remove(),400);
}},3500);
}
async function configurarNotificacoes(){
const botao=document.getElementById('btn-notificacoes');
if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){
botao.textContent='🔔 Notificações não disponíveis';
botao.disabled=true;
return;
}
try{
registroServiceWorker=await navigator.serviceWorker.register('/service-worker.js');
const inscricao=await registroServiceWorker.pushManager.getSubscription();
if(inscricao){
botao.textContent='🔔 Notificações ativadas';
botao.classList.add('notificacoes-ativas');
}
}catch(erro){
console.error('Erro ao registrar notificações:',erro);
}}
async function ativarNotificacoes(){
const botao=document.getElementById('btn-notificacoes');
try{
if(!registroServiceWorker)registroServiceWorker=await navigator.serviceWorker.register('/service-worker.js');
const permissao=await Notification.requestPermission();
if(permissao!=='granted'){
botao.textContent='🔕 Notificações bloqueadas';
return;
}
const respostaChave=await fetch('/api/notificacoes/chave-publica',{cache:'no-store'});
if(!respostaChave.ok)throw new Error('Não foi possível obter a chave pública.');
const dadosChave=await respostaChave.json();
if(!dadosChave.chavePublica)throw new Error('A chave pública não está configurada no servidor.');
const chave=converterChave(dadosChave.chavePublica);
let inscricao=await registroServiceWorker.pushManager.getSubscription();
if(!inscricao)inscricao=await registroServiceWorker.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:chave});
const resposta=await fetch('/api/notificacoes/inscrever',{
method:'POST',
headers:{'Content-Type':'application/json'},
credentials:'include',
body:JSON.stringify(inscricao)
});
const resultado=await resposta.json();
if(!resposta.ok)throw new Error(resultado.erro||'Não foi possível registrar o dispositivo.');
botao.textContent='🔔 Notificações ativadas';
botao.classList.add('notificacoes-ativas');
console.log('✅ Dispositivo inscrito para receber notificações.');
}catch(erro){
console.error('❌ Erro ao ativar notificações:',erro);
botao.textContent='🔔 Tentar novamente';
alert('Não foi possível ativar as notificações: '+erro.message);
}}
function converterChave(base64){
const padding='='.repeat((4-base64.length%4)%4);
const base64Url=(base64+padding).replace(/-/g,'+').replace(/_/g,'/');
const dados=window.atob(base64Url);
const array=new Uint8Array(dados.length);
for(let i=0;i<dados.length;i++)array[i]=dados.charCodeAt(i);
return array;
}
document.getElementById('btn-notificacoes').addEventListener('click',ativarNotificacoes);
document.addEventListener('DOMContentLoaded',async()=>{
mostrarMensagem();
await carregarAvisos();
configurarNotificacoes();
setInterval(carregarAvisos,10000);
});
</script>
</body>
</html>
