<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Mural de Avisos Digitais</h2>
        <div class="nav-actions" id="navActions">
            <!-- Atualizado via JS -->
            <a href="login.html" class="btn-secundary">Acesso Administrativo</a>
        </div>
    </nav>

    <!-- Área de publicação de avisos (Oculta por padrão, visível apenas para logados) -->
    <div class="mural-container" id="areaCriacao" style="display: none; max-width: 600px;">
        <div class="form-box" style="max-width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:15px; color:#1e3c72;">Publicar Novo Aviso</h3>
            <form id="avisoForm" enctype="multipart/form-data">
                <div class="input-group">
                    <label>Título do Aviso</label>
                    <input type="text" id="tituloAviso" name="titulo" required>
                </div>
                <div class="input-group">
                    <label>Conteúdo / Texto</label>
                    <textarea id="conteudoAviso" name="conteudo" rows="4" required></textarea>
                </div>
                <div class="input-group">
                    <label>Imagem de Referência (Opcional)</label>
                    <input type="file" id="imagemAviso" name="imagem" accept="image/*">
                </div>
                <button type="submit" class="btn-primary" style="width:100%; border-radius:8px;">Postar no Mural</button>
            </form>
        </div>
    </div>

    <!-- O Mural Exibível -->
    <main class="mural-container">
        <div class="grid-avisos" id="muralGrid">
            <!-- Carregado via JS dinamicamente -->
        </div>
    </main>

    <script>
        let usuarioLogado = false;

        async function checarStatus() {
            const res = await fetch('/api/usuario-atual');
            const status = await res.json();
            
            const navActions = document.getElementById('navActions');
            const areaCriacao = document.getElementById('areaCriacao');

            if(status.logado) {
                usuarioLogado = true;
                areaCriacao.style.display = 'block';
                navActions.innerHTML = `
                    <span>Olá, <b>${status.nome}</b></span>
                    <button onclick="logout()" class="btn-secundary" style="background:#dc3545; border:none;">Sair</button>
                `;
            }
            carregarAvisos();
        }

        async function carregarAvisos() {
            const res = await fetch('/api/avisos');
            const avisos = await res.json();
            const grid = document.getElementById('muralGrid');
            grid.innerHTML = '';

            if(avisos.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#888;">Nenhum aviso publicado no momento.</p>';
                return;
            }

            avisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR');
                const card = document.createElement('div');
                card.className = 'card-aviso';
                
                card.innerHTML = `
                    ${aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : ''}
                    <div class="card-body">
                        <h3>${aviso.titulo}</h3>
                        <p>${aviso.conteudo}</p>
                        <div class="card-footer">
                            <span>Postado em: ${dataFormatada}</span>
                            ${usuarioLogado ? `<button class="btn-delete" onclick="deletarAviso(${aviso.id})">Apagar</button>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('avisoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch('/api/avisos', {
                method: 'POST',
                body: formData
            });

            if(res.ok) {
                e.target.reset();
                carregarAvisos();
            } else {
                alert('Erro ao postar aviso');
            }
        });

        async function deletarAviso(id) {
            if(confirm('Tem certeza que deseja apagar este aviso?')) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                if(res.ok) carregarAvisos();
            }
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.reload();
        }

        // Executar ao abrir a tela
        checarStatus();
        
        // Auto-refresh a cada 30 segundos para manter os monitores escolares atualizados
        setInterval(carregarAvisos, 30000);
    </script>
</body>
</html>
