<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos Escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="mural-header">
            <h2>📢 Mural Digital Informativo</h2>
            <div id="authActions">
                <a href="login.html" class="btn-primary" style="padding: 8px 20px; font-size: 0.9rem;">Área Restrita</a>
            </div>
        </div>

        <!-- Seção de publicação (Fica visível apenas se logado) -->
        <div id="areaPublicar" class="form-container" style="display: none; margin: 20px 0 40px 0; max-width: 100%;">
            <h3>Nova Publicação</h3>
            <form id="formAviso" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Título do Aviso</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>
                <div class="form-group">
                    <label>Conteúdo / Descrição</label>
                    <textarea id="conteudo" name="conteudo" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Imagem de Referência (Opcional)</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Publicar no Mural</button>
            </form>
        </div>

        <!-- Exibição dos Avisos -->
        <div class="grid-avisos" id="muralGrid"></div>
    </div>

    <script>
        let usuarioLogado = false;

        async function checarLogin() {
            const res = await fetch('/api/usuario');
            const dados = await res.json();
            if (dados.logado) {
                usuarioLogado = true;
                document.getElementById('authActions').innerHTML = `
                    <span style="margin-right:15px">Olá, <b>${dados.nome}</b></span>
                    <button onclick="logout()" class="btn-delete" style="padding:8px 15px">Sair</button>
                `;
                document.getElementById('areaPublicar').style.display = 'block';
            }
            carregarAvisos();
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.reload();
        }

        async function carregarAvisos() {
            const res = await fetch('/api/avisos');
            const avisos = await res.json();
            const grid = document.getElementById('muralGrid');
            grid.innerHTML = '';

            avisos.forEach(aviso => {
                const dataFormatada = new Date(aviso.data_criacao).toLocaleDateString('pt-BR');
                const imgTag = aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : '';
                const btnDeletar = usuarioLogado ? `<button class="btn-delete" onclick="deletarAviso(${aviso.id})">Apagar</button>` : '';

                grid.innerHTML += `
                    <div class="card-aviso">
                        ${imgTag}
                        <div class="card-body">
                            <h3>${aviso.titulo}</h3>
                            <p>${aviso.conteudo}</p>
                        </div>
                        <div class="card-footer">
                            <span>Por: ${aviso.autor || 'Coordenação'} em ${dataFormatada}</span>
                            ${btnDeletar}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('formAviso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch('/api/avisos', {
                method: 'POST',
                body: formData
            });
            
            if (res.ok) {
                e.target.reset();
                carregarAvisos();
            } else {
                alert('Erro ao publicar aviso.');
            }
        });

        async function deletarAviso(id) {
            if (confirm('Tem certeza que quer apagar este aviso?')) {
                const res = await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
                if (res.ok) carregarAvisos();
            }
        }

        // Inicia a verificação ao abrir a página
        checarLogin();
    </script>
</body>
</html>
