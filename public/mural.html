<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural de Avisos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container container-mural" id="conteudo-mural">
        
        <div class="controle-superior">
            <button id="btn-fullscreen" class="btn-tv" onclick="alternarTelaCheia()">📺 Modo TV / Tela Cheia</button>
            <a href="/auth/logout" class="logout-lnk">Sair</a>
        </div>

        <div class="form-header">
            <h2>Mural de Avisos</h2>
        </div>
        
        <div class="user-info">
            Olá, <b id="nome-usuario">...</b> (<span id="cargo-usuario">...</span>)
        </div>

        <!-- Formulário visível apenas para Funcionários -->
        <div id="area-postagem" class="hidden">
            <h3>Publicar Novo Aviso</h3>
            <form action="/api/avisos" method="POST" enctype="multipart/form-data">
                <input type="text" name="titulo" placeholder="Título do Aviso" required>
                <textarea name="conteudo" placeholder="Conteúdo do aviso..." rows="4" required></textarea>
                <label style="font-weight: 600; font-size: 14px; color: #475569;">Imagem de Referência (Opcional):</label>
                <input type="file" name="imagem" accept="image/*">
                <button type="submit">Publicar Aviso</button>
            </form>
        </div>

        <hr id="linha-separadora" style="border: 0; border-top: 2px solid #e2e8f0; margin: 30px 0;">
        
        <!-- BARRA DE PESQUISA (Oculta por padrão via ID, controlada pelo JS) -->
        <div class="search-container hidden" id="area-busca-alunos">
            <h3>Buscar Avisos</h3>
            <input type="text" id="campo-busca" placeholder="🔍 Buscar avisos por título ou conteúdo..." onkeyup="filtrarAvisos()">
        </div>

        <h3 id="titulo-lista-avisos">Avisos Recentes</h3>
        <div id="lista-avisos"></div>
    </div>

    <script>
        let usuarioAtual = null;
        let todosAvisos = []; 
        let ultimoIdAviso = 0; // Controla qual foi o último aviso visto para disparar notificação
        let primeiraCarga = true;

        async function carregarUsuario() {
            const res = await fetch('/api/usuario-atual');
            if (!res.ok) {
                window.location.href = '/login'; 
                return;
            }
            usuarioAtual = await res.json();
            document.getElementById('nome-usuario').innerText = usuarioAtual.nome;
            document.getElementById('cargo-usuario').innerText = usuarioAtual.cargo;

            // Regra: Mostra formulário se for funcionário, mostra busca se for Aluno/Responsável
            if (['professor', 'coordenador', 'direcao'].includes(usuarioAtual.cargo)) {
                document.getElementById('area-postagem').classList.remove('hidden');
            } else {
                document.getElementById('area-busca-alunos').classList.remove('hidden');
                solicitarPermissaoNotificacao(); // Pede para o aluno ativar notificações
            }
            
            await carregarAvisos();
            // Verifica se há novos avisos no servidor a cada 10 segundos
            setInterval(checarNovosAvisos, 10000);
        }

        async function carregarAvisos() {
            const res = await fetch('/api/avisos');
            todosAvisos = await res.json(); 
            
            if (todosAvisos.length > 0 && primeiraCarga) {
                ultimoIdAviso = todosAvisos[0].id; // Salva o ID do aviso mais recente do topo
                primeiraCarga = false;
            }
            
            renderizarAvisos(todosAvisos);
        }

        // Função em segundo plano que roda na TV ou no celular do Aluno buscando novidades
        async function checarNovosAvisos() {
            const res = await fetch('/api/avisos');
            const novosAvisos = await res.json();
            
            if (novosAvisos.length > 0) {
                // Se o ID do topo for maior do que o último guardado, tem publicação nova!
                if (novosAvisos[0].id > ultimoIdAviso) {
                    ultimoIdAviso = novosAvisos[0].id;
                    todosAvisos = novosAvisos;
                    renderizarAvisos(todosAvisos);
                    
                    // Só dispara notificação se for Aluno ou Responsável
                    if (['aluno', 'responsavel'].includes(usuarioAtual.cargo)) {
                        dispararNotificacao(novosAvisos[0].titulo, novosAvisos[0].conteudo);
                    }
                }
            }
        }

        // SISTEMA DE NOTIFICAÇÃO PUSH NATIVA
        function solicitarPermissaoNotificacao() {
            if ("Notification" in window) {
                Notification.requestPermission();
            }
        }

        function dispararNotificacao(titulo, conteudo) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("📢 Novo Aviso Escolar!", {
                    body: `${titulo}: ${conteudo.substring(0, 50)}...`,
                    icon: "/uploads/logo.png" // Opcional: ícone da notificação
                });
            }
        }

        function renderizarAvisos(listaParaExibir) {
            const lista = document.getElementById('lista-avisos');
            lista.innerHTML = '';

            if (listaParaExibir.length === 0) {
                lista.innerHTML = '<p style="text-align: center; color: #64748b; margin-top: 20px;">Nenhum aviso encontrado.</p>';
                return;
            }

            listaParaExibir.forEach(aviso => {
                const card = document.createElement('div');
                card.className = 'aviso-card';
                
                let botaoApagar = '';
                if (['professor', 'coordenador', 'direcao'].includes(usuarioAtual.cargo)) {
                    botaoApagar = `<button class="btn-delete" onclick="apagarAviso(${aviso.id})">Apagar</button>`;
                }

                let tagImagem = aviso.imagem ? `<img src="${aviso.imagem}" alt="Referência">` : '';

                card.innerHTML = `
                    ${botaoApagar}
                    <h4>${aviso.titulo}</h4>
                    <p>${aviso.conteudo}</p>
                    ${tagImagem}
                    <small>Postado por: ${aviso.autor} em ${aviso.data}</small>
                `;
                lista.appendChild(card);
            });
        }

        function filtrarAvisos() {
            const termoBusca = document.getElementById('campo-busca').value.toLowerCase();
            const avisosFiltrados = todosAvisos.filter(aviso => {
                return aviso.titulo.toLowerCase().includes(termoBusca) || aviso.conteudo.toLowerCase().includes(termoBusca);
            });
            renderizarAvisos(avisosFiltrados);
        }

        async function apagarAviso(id) {
            await fetch(`/api/avisos/${id}`, { method: 'DELETE' });
            carregarAvisos(); 
        }

        function alternarTelaCheia() {
            const muralElemento = document.getElementById('conteudo-mural');
            if (!document.fullscreenElement) {
                if (muralElemento.requestFullscreen) muralElemento.requestFullscreen();
                else if (muralElemento.webkitRequestFullscreen) muralElemento.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', gerenciarEstiloFullscreen);
        document.addEventListener('webkitfullscreenchange', gerenciarEstiloFullscreen);

        function gerenciarEstiloFullscreen() {
            const muralElemento = document.getElementById('conteudo-mural');
            const btnTv = document.getElementById('btn-fullscreen');

            if (document.fullscreenElement) {
                muralElemento.classList.add('modo-totem-ativo');
                btnTv.innerText = "❌ Sair do Modo TV";
            } else {
                muralElemento.classList.remove('modo-totem-ativo');
                btnTv.innerText = "📺 Modo TV / Tela Cheia";
            }
        }

        carregarUsuario();
    </script>
</body>
</html>
