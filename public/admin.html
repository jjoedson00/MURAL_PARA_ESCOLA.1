<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-admin">

<button type="button" class="btn-sair-professor" id="btn-sair">🚪 Sair do Acesso Professor</button>

<div class="container">
    <h2>📢 Nova Publicação</h2>
    <p class="admin-descricao">Publique um novo comunicado no mural.</p>
    <div id="professor-logado"></div>


<form id="form-aviso">
    <div class="form-group">
        <label for="titulo-aviso">Título do Aviso</label>
        <input type="text" id="titulo-aviso" placeholder="Ex: Reunião de Pais" required>
    </div>

    <div class="form-group">
        <label for="conteudo-aviso">Conteúdo / Descrição</label>
        <textarea id="conteudo-aviso" placeholder="Digite os detalhes do comunicado..." required></textarea>
    </div>

    <div class="form-group">
        <label for="prioridade-aviso">Importância / Cor da Etiqueta</label>
        <select id="prioridade-aviso">
            <option value="Normal">⚪ Aviso Normal</option>
            <option value="Importante">🟡 Aviso Importante</option>
            <option value="Urgente">🔴 Aviso Urgente</option>
        </select>
    </div>

    <div class="form-group">
        <label for="imagem-aviso">📸 Adicionar Imagem (Opcional)</label>
        <input type="file" id="imagem-aviso" accept="image/*">
    </div>

    <button type="submit" class="btn-green" id="btn-publicar">Publicar no Mural</button>
    <a href="/mural.html" class="link-voltar">← Voltar para o Mural</a>
</form>


</div>

<div class="gestao-container">
    <span class="gestao-label">GERENCIAMENTO</span>
    <h3>Avisos Ativos</h3>
    <div id="lista-gerenciamento-avisos"></div>
</div>

<div id="caixa-confirmacao" class="caixa-confirmacao">
    <div class="confirmacao-conteudo">
        <h3 id="confirmacao-titulo">Confirmar ação</h3>
        <p id="confirmacao-texto"></p>
        <div class="confirmacao-botoes">
            <button type="button" id="confirmar-acao" class="btn-confirmar">Confirmar</button>
            <button type="button" id="cancelar-acao" class="btn-cancelar">Cancelar</button>
        </div>
    </div>
</div>

<script>
let acaoConfirmacao=null;

function mostrarConfirmacao(titulo,texto,acao){
    document.getElementById('confirmacao-titulo').textContent=titulo;
    document.getElementById('confirmacao-texto').textContent=texto;
    document.getElementById('caixa-confirmacao').classList.add('mostrar');
    acaoConfirmacao=acao;
}

function fecharConfirmacao(){
    document.getElementById('caixa-confirmacao').classList.remove('mostrar');
    acaoConfirmacao=null;
}

document.getElementById('cancelar-acao').addEventListener('click',fecharConfirmacao);

document.getElementById('confirmar-acao').addEventListener('click',async()=>{
    if(acaoConfirmacao){
        const acao=acaoConfirmacao;
        fecharConfirmacao();
        await acao();
    }
});

document.getElementById('caixa-confirmacao').addEventListener('click',(e)=>{
    if(e.target.id==='caixa-confirmacao') fecharConfirmacao();
});

async function verificarSessao(){
    const elemento=document.getElementById('professor-logado');

    try{
        const resposta=await fetch('/api/sessao',{
            credentials:'include',
            cache:'no-store'
        });

        if(!resposta.ok){
            elemento.innerHTML='<div class="professor-logado">⚠️ Não foi possível verificar seu acesso.</div>';
            return false;
        }

        const dados=await resposta.json();

        if(!dados.logado||!dados.professor){
            elemento.innerHTML='<div class="professor-logado">⚠️ Sessão não encontrada. Faça login novamente.</div>';

            setTimeout(()=>{
                window.location.href='/login.html';
            },1000);

            return false;
        }

        elemento.innerHTML=`
            <div class="professor-logado">
                👨‍🏫 Logado como:
                <strong>${dados.professor.nome}</strong>
            </div>
        `;

        return true;

    }catch(erro){
        console.error('Erro ao verificar sessão:',erro);
        elemento.innerHTML='<div class="professor-logado">⚠️ Erro ao verificar o acesso. Tente novamente.</div>';
        return false;
    }
}

document.getElementById('btn-sair').addEventListener('click',()=>{
    mostrarConfirmacao(
        '🚪 Sair do Acesso Professor',
        'Deseja realmente sair da sua conta?',
        async()=>{
            try{
                const resposta=await fetch('/api/logout',{
                    method:'POST',
                    credentials:'include'
                });

                const dados=await resposta.json();

                if(resposta.ok){
                    sessionStorage.setItem('mensagemMural','Você saiu do Acesso Professor.');
                    window.location.href='/mural.html';
                }else{
                    alert(dados.erro||'Não foi possível sair da conta.');
                }

            }catch(erro){
                console.error(erro);
                alert('Não foi possível conectar ao servidor.');
            }
        }
    );
});

document.getElementById('form-aviso').addEventListener('submit',async(e)=>{
    e.preventDefault();

    const botao=document.getElementById('btn-publicar');
    const titulo=document.getElementById('titulo-aviso').value.trim();
    const conteudo=document.getElementById('conteudo-aviso').value.trim();
    const prioridade=document.getElementById('prioridade-aviso').value;
    const imagemInput=document.getElementById('imagem-aviso');
    const formData=new FormData();

    formData.append('titulo',titulo);
    formData.append('conteudo',conteudo);
    formData.append('prioridade',prioridade);

    if(imagemInput.files&&imagemInput.files.length>0){
        formData.append('imagem',imagemInput.files[0]);
    }

    botao.disabled=true;
    botao.textContent='Publicando...';

    try{
        const resposta=await fetch('/api/avisos',{
            method:'POST',
            credentials:'include',
            body:formData
        });

        const dados=await resposta.json();

        if(resposta.ok){
            document.getElementById('form-aviso').reset();
            await carregarAvisosGestao();
            alert(dados.mensagem||'Aviso publicado com sucesso!');
        }else{
            alert(dados.error||dados.erro||'Erro ao publicar o aviso.');
        }

    }catch(erro){
        console.error(erro);
        alert('Não foi possível conectar ao servidor.');
    }finally{
        botao.disabled=false;
        botao.textContent='Publicar no Mural';
    }
});

async function carregarAvisosGestao(){
    try{
        const resposta=await fetch('/api/avisos',{
            credentials:'include',
            cache:'no-store'
        });

        if(!resposta.ok){
            console.error('Erro ao carregar avisos:',resposta.status);
            return;
        }

        const avisos=await resposta.json();
        const container=document.getElementById('lista-gerenciamento-avisos');

        container.innerHTML='';

        if(!avisos||avisos.length===0){
            container.innerHTML='<p class="nenhum-aviso">Nenhum aviso ativo.</p>';
            return;
        }

        avisos.forEach(aviso=>{
            const card=document.createElement('div');
            card.className='card-gestao';

            card.innerHTML=`
                <div class="gestao-info">
                    <strong>${aviso.titulo}</strong>
                    <span>✍️ ${aviso.autor}</span>
                </div>
                <button class="btn-apagar" onclick="apagarAviso(${aviso.id})">
                    Apagar
                </button>
            `;

            container.appendChild(card);
        });

    }catch(erro){
        console.error('Erro ao carregar avisos:',erro);
    }
}

function apagarAviso(id){
    mostrarConfirmacao(
        '🗑️ Apagar aviso',
        'Tem certeza que deseja apagar este aviso permanentemente?',
        async()=>{
            try{
                const resposta=await fetch(`/api/avisos/${id}`,{
                    method:'DELETE',
                    credentials:'include'
                });

                const dados=await resposta.json();

                if(resposta.ok){
                    await carregarAvisosGestao();

                    sessionStorage.setItem('mensagemMural','Aviso apagado com sucesso!');
                    alert('Aviso apagado com sucesso!');
                }else{
                    alert(dados.erro||dados.error||'Não foi possível apagar o aviso.');
                }

            }catch(erro){
                console.error(erro);
                alert('Não foi possível conectar ao servidor.');
            }
        }
    );
}

document.addEventListener('DOMContentLoaded',async()=>{
    const logado=await verificarSessao();

    if(logado){
        carregarAvisosGestao();
    }
});
</script>

</body>
</html>
