<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Administrativo - Mural Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        
        /* ADAPTADO: Caixa grande e fluida perfeita para a tela do seu computador */
        .box-login { 
            background-color: #ffffff; 
            padding: 40px 36px; 
            border-radius: 24px; 
            width: 90%; 
            max-width: 500px; 
            color: #0f172a; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
        }
        
        .input-grupo { margin-bottom: 20px; }
        .input-grupo label { display: block; font-size: 0.9rem; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .input-grupo input { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; font-size: 1rem; outline: none; color: #0f172a; }
        .input-grupo input:focus { border-color: #2563eb; }
        .btn-enviar { width: 100%; background-color: #16a34a; color: white; font-weight: bold; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-top: 12px; }
        .btn-enviar:hover { background-color: #15803d; }
        .btn-voltar { display: block; text-align: center; color: #64748b; margin-top: 20px; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box-login">
        <div style="text-align: center; margin-bottom: 24px;">
            <span style="font-size: 2.5rem;">👨‍🏫</span>
            <!-- ALTERADO: Título customizado solicitado por você -->
            <h2 style="font-size: 1.35rem; font-weight: 900; margin-top: 6px; line-height: 1.3; color:#0f172a;">Professores, Coordenadores ou Direção</h2>
        </div>
        <form id="form-cadastro">
            <div class="input-grupo"><label>Usuário</label><input type="text" id="cad-username" required placeholder="Ex: prof_ana"></div>
            <div class="input-grupo"><label>E-mail</label><input type="email" id="cad-email" required placeholder="Ex: ana@escola.com"></div>
            <div class="input-grupo"><label>Senha</label><input type="password" id="cad-password" required placeholder="No mínimo 6 caracteres"></div>
            <!-- RECONSTRUÍDO: Campo de token perfeitamente encaixado no layout -->
            <div class="input-grupo">
                <label style="color:#c2410c;">🔑 Token de Acesso</label>
                <input type="password" id="cad-chave" required placeholder="Digite o código interno da escola">
            </div>
            <!-- BOTÃO VERDE TOTALMENTE VISÍVEL -->
            <button type="submit" class="btn-enviar">Concluir Cadastro</button>
        </form>
        <a href="login.html" class="btn-voltar">Já tem conta? Faça Login</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, get } from "https://gstatic.com";

        const firebaseConfig = { databaseURL: "https://firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('cad-username').value;
            const email = document.getElementById('cad-email').value;
            const password = document.getElementById('cad-password').value;
            const chaveAcesso = document.getElementById('cad-chave').value;

            // VALIDAÇÃO 1: Bloqueia se o token estiver incorreto
            if (chaveAcesso !== 'COORDENACAO2026') { alert('❌ Token de Acesso incorreto! Registro negado.'); return; }

            // VALIDAÇÃO 2: Bloqueia e-mails duplicados
            const usuariosRef = ref(db, 'usuarios');
            const snapshot = await get(usuariosRef);
            let emailRepetido = false;
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    if (childSnapshot.val().email === email) { emailRepetido = true; }
                });
            }

            if (emailRepetido) { alert('❌ Este endereço de e-mail já está em uso por outro administrador!'); return; }

            // Cadastro efetuado com sucesso na nuvem Google
            const userRef = ref(db, 'usuarios/' + username);
            await set(userRef, { username, email, password });
            alert('✅ Cadastro concluído! Conta criada com sucesso.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
