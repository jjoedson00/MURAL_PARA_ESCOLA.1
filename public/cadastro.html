<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor</title>
    <!-- Barra adicionada para carregar na nuvem -->
    <link rel="stylesheet" href="/style.css">
</head>
<body class="form-screen">
    
    <div class="form-box-grande">
        <h2>Cadastro de Professor</h2>
        
        <div id="mensagemFeedback" class="mensagem-alerta-tela"></div>

        <form id="cadastroForm">
            <div class="input-group-grande">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>
            
            <div class="input-group-grande">
                <label>E-mail Institucional</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            
            <div class="input-group-grande">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" placeholder="Crie uma senha forte" required>
            </div>
            
            <div class="input-group-grande">
                <label>Token Secreto da Coordenação</label>
                <input type="password" id="token" placeholder="Insira o código secreto exigido" required>
            </div>
            
            <button type="submit" class="btn-grande">Cadastrar e Entrar</button>
        </form>
        
        <p style="margin-top: 25px; text-align: center; font-size: 1.15rem;">
            Já possui uma conta? <a href="login.html" style="color: #1e3c72; font-weight: bold; text-decoration: none;">Faça Login</a>
        </p>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const token = document.getElementById('token').value;
            const caixaMensagem = document.getElementById('mensagemFeedback');

            caixaMensagem.style.display = 'none';

            try {
                const res = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, token })
                });
                
                const dados = await res.json();
                
                if (dados.sucesso) {
                    caixaMensagem.textContent = 'Cadastro realizado! Entrando no painel de avisos...';
                    caixaMensagem.className = 'mensagem-alerta-tela alerta-sucesso-tela';
                    caixaMensagem.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'mural.html'; 
                    }, 1500);
                } else {
                    caixaMensagem.textContent = dados.erro;
                    caixaMensagem.className = 'mensagem-alerta-tela alerta-erro-tela';
                    caixaMensagem.style.display = 'block';
                }
            } catch {
                caixaMensagem.textContent = 'Erro ao se conectar com o servidor.';
                caixaMensagem.className = 'mensagem-alerta-tela alerta-erro-tela';
                caixaMensagem.style.display = 'block';
            }
        });
    </script>
</body>
</html>
