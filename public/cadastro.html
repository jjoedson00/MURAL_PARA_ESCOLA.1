<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-cadastro">

    <div class="box-cadastro">

        <h2>👨‍🏫 Cadastro de Professor</h2>

        <form id="form-cadastro">

            <div class="form-group">
                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >
            </div>

            <div class="form-group">
                <label for="token">
                    🔑 Token da Coordenação
                </label>

                <input
                    type="password"
                    id="token"
                    name="token"
                    placeholder="Digite o token fornecido pela coordenação"
                    required
                >
            </div>

            <div id="mensagem-erro"></div>

            <button
                type="submit"
                class="btn-submit">
                Criar Conta
            </button>

        </form>

        <p class="cadastro-login">
            Já possui uma conta?

            <a href="/login.html">
                Fazer Login
            </a>
        </p>

    </div>

    <script>
        const formulario =
            document.getElementById('form-cadastro');

        const mensagemErro =
            document.getElementById('mensagem-erro');

        formulario.addEventListener(
            'submit',
            async function(event) {

                event.preventDefault();

                mensagemErro.style.display = 'none';
                mensagemErro.textContent = '';

                const nome =
                    document.getElementById('nome')
                        .value
                        .trim();

                const email =
                    document.getElementById('email')
                        .value
                        .trim();

                const senha =
                    document.getElementById('senha')
                        .value;

                const token =
                    document.getElementById('token')
                        .value
                        .trim();

                try {
                    const resposta = await fetch(
                        '/api/cadastro',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                nome,
                                email,
                                senha,
                                token
                            })
                        }
                    );

                    const dados =
                        await resposta.json();

                    if (!resposta.ok) {

                        mensagemErro.textContent =
                            dados.erro ||
                            'Não foi possível realizar o cadastro.';

                        mensagemErro.style.display =
                            'block';

                        return;
                    }

                    window.location.href =
                        '/admin.html';

                } catch (erro) {

                    console.error(erro);

                    mensagemErro.textContent =
                        'Não foi possível conectar ao servidor.';

                    mensagemErro.style.display =
                        'block';
                }
            }
        );
    </script>

</body>
</html>
