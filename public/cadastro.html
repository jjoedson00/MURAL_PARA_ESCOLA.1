<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth-bg">

    <div class="modal-static">
        <div class="modal-content-fixed">
            <a href="mural.html" class="close-auth">&times;</a>
            <h3>Cadastro de Professor</h3>
            <form id="form-cadastro">
                <input type="text" id="cad-nome" placeholder="Nome Completo" required>
                <input type="email" id="cad-email" placeholder="E-mail Institucional" required>
                <input type="password" id="cad-senha" placeholder="Senha de Acesso" required>
                <input type="password" id="cad-token" placeholder="Token de Segurança da Coordenação" required>
                <button type="submit" class="btn-success-block">Criar Conta</button>
            </form>
            <p class="switch-form">Já tem conta? <a href="login.html">Fazer Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById("form-cadastro").addEventListener("submit", async function(e) {
            e.preventDefault();
            const nome = document.getElementById("cad-nome").value;
            const email = document.getElementById("cad-email").value;
            const senha = document.getElementById("cad-senha").value;
            const token = document.getElementById("cad-token").value;

            // Validação de Domínio Institucional
            const dominioObrigatorio = '@escola.com'; 
            if (!email.toLowerCase().endsWith(dominioObrigatorio)) {
                alert(`Erro: Você precisa usar um e-mail institucional válido terminando em ${dominioObrigatorio}`);
                return;
            }

            const res = await fetch('/api/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, token })
            });
            const data = await res.json();

            if(data.sucesso) {
                alert("Cadastro realizado com sucesso! Entrando no painel...");
                
                // 🚀 LOGIN AUTOMÁTICO: Faz uma requisição silenciosa de login logo após cadastrar
                await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                // Redireciona o professor direto para a página privada do mural
                window.location.href = "mural.html";
            } else {
                alert(data.erro || "Erro ao realizar cadastro.");
            }
        });
    </script>
</body>
</html>
