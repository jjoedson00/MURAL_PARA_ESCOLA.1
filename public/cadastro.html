<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro - Mural Escolar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .erro-alerta { background-color: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; border: 1px solid #fca5a5; font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: 600; }
        .campo-senha-container { position: relative; width: 100%; }
        .btn-ver-senha { position: absolute; right: 15px; top: 38%; transform: translateY(-50%); background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; width: auto; padding: 0; box-shadow: none; }
        .btn-ver-senha:hover { background: none; transform: translateY(-50%) scale(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h2>Criar Conta</h2>
        </div>

        <div id="mensagem-erro" class="erro-alerta hidden"></div>

        <form id="form-cadastro">
            <input type="text" id="nome" placeholder="Nome de Usuário (Ex: JoaoSilva)" required>
            <input type="email" id="email" placeholder="Email" required>
            
            <div class="campo-senha-container">
                <input type="password" id="senha" placeholder="Senha (Mínimo 6 caracteres)" minlength="6" required>
                <button type="button" class="btn-ver-senha" onclick="alternarVisibilidade('senha', this)">👁️</button>
            </div>

            <select id="cargo" onchange="verificarCargo()" required>
                <option value="aluno">Aluno</option>
                <option value="responsavel">Responsável</option>
                <option value="professor">Professor</option>
                <option value="coordenador">Coordenador</option>
                <option value="direcao">Direção</option>
            </select>

            <!-- O campo da senha de acesso do funcionário começa invisível -->
            <div id="campo-chave" class="hidden">
                <input type="password" id="chaveAcesso" placeholder="Chave de Acesso do Funcionário">
            </div>

            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem conta? <a href="/login">Fazer Login</a></p>
    </div>

    <script>
        function alternarVisibilidade(idCampo, botao) {
            const campo = document.getElementById(idCampo);
            if (campo.type === "password") {
                campo.type = "text";
                botao.innerText = "🙈";
            } else {
                campo.type = "password";
                botao.innerText = "👁️";
            }
        }

        function verificarCargo() {
            const cargo = document.getElementById('cargo').value;
            const campoChave = document.getElementById('campo-chave');
            const inputChave = document.getElementById('chaveAcesso');
            
            if (['professor', 'coordenador', 'direcao'].includes(cargo)) {
                campoChave.classList.remove('hidden');
                inputChave.setAttribute('required', 'required'); // Torna obrigatório se for funcionário
            } else {
                campoChave.classList.add('hidden');
                inputChave.removeAttribute('required');
                inputChave.value = '';
            }
        }

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const cargo = document.getElementById('cargo').value;
            const chaveAcesso = document.getElementById('chaveAcesso').value;
            const erroDiv = document.getElementById('mensagem-erro');

            erroDiv.classList.add('hidden');

            try {
                const res = await fetch('/auth/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, cargo, chaveAcesso })
                });

                const dados = await res.json();

                if (!res.ok) {
                    // EXIBE O MOTIVO EXATO NA TELA
                    erroDiv.innerText = dados.erro || 'Erro ao realizar cadastro.';
                    erroDiv.classList.remove('hidden');
                } else {
                    window.location.href = '/login';
                }
            } catch (err) {
                erroDiv.innerText = 'Erro de conexão com o servidor.';
                erroDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
