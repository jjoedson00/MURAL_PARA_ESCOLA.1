<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-screen">
    <div class="form-box">
        <h2>Cadastro de Professor</h2>
        <form id="cadastroForm">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="input-group">
                <label>E-mail Institucional</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" required>
            </div>
            <div class="input-group">
                <label>Token Secreto da Coordenação</label>
                <input type="password" id="token" placeholder="Insira o código secreto" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border-radius: 8px;">Cadastrar Professor</button>
        </form>
        <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
            Já possui uma conta? <a href="login.html" style="color: #1e3c72; font-weight: bold;">Faça Login</a>
        </p>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const token = document.getElementById('token').value;

            const res = await fetch('/api/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, token })
            });
            const dados = await res.json();
            if (dados.sucesso) {
                alert('Cadastro realizado com sucesso! Agora você pode fazer login.');
                window.location.href = 'login.html';
            } else {
                alert(dados.erro);
            }
        });
    </script>
</body>
</html>
