<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mural Escolar</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container-form">
        <form id="form-cadastro">
            <h2>Criar Conta</h2>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Escolha um e-mail">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Crie uma senha estável">
            </div>
            <button type="submit">Cadastrar Administrador</button>
            <p>Já possui cadastro? <a href="login.html">Fazer Login</a></p>
        </form>
    </div>

    <script type="module">
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById('email').value;
            const senhaInput = document.getElementById('senha').value;

            try {
                const response = await fetch('/auth/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput, senha: senhaInput })
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert('✅ Administrador cadastrado com sucesso!');
                    window.location.href = 'login.html';
                } else {
                    alert(`❌ Erro: ${resultado.erro}`);
                }

            } catch (error) {
                console.error("Erro na comunicação de cadastro:", error);
                alert('❌ Falha de comunicação com o servidor.');
            }
        });
    </script>
</body>
</html>
