<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor</title>
    <!-- 🎯 Adicionado ?v=2 para forçar o tamanho gigante e quebrar o cache -->
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div id="notification-container"></div>

    <div class="form-container">
        <h2>Criar Conta de Professor</h2>
        <form id="cadastroForm" autocomplete="off">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@escola.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="Crie uma senha">
            </div>
            <div class="form-group">
                <label>Token de Autenticação</label>
                <input type="password" id="token" placeholder="Digite o código da coordenação" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Cadastrar e Entrar</button>
        </form>
        <p style="margin-top: 30px; text-align: center; font-size: 1.2rem;"><a href="login.html" style="color: #1e3c72; font-weight: bold;">Voltar para Login</a></p>
    </div>

    <script>
        function mostrarNotificacao(mensagem, tipo = 'error') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const token = document.getElementById('token').value;

            const resCadastro = await fetch('/api/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, token })
            });
            const dadosCadastro = await resCadastro.json();
            
            if (dadosCadastro.sucesso) {
                const resLogin = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const dadosLogin = await resLogin.json();
                
                if (dadosLogin.sucesso) {
                    window.location.href = 'mural.html';
                } else {
                    window.location.href = 'login.html';
                }
            } else {
                mostrarNotificacao(dadosCadastro.erro, 'error');
            }
        });
    </script>
</body>
</html>
