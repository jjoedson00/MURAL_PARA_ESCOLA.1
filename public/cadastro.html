<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Criar Conta de Professor</h2>
        <form id="cadastroForm">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <div class="form-group">
                <label>Token de Autenticação da Coordenação</label>
                <input type="password" id="token" placeholder="Código de segurança" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Cadastrar</button>
        </form>
        <p style="margin-top: 15px; text-align: center;"><a href="login.html">Voltar para Login</a></p>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const token = document.getElementById('token').value;

            const res = await fetch('/api/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, token })
            });
            const dados = await res.json();
            if (dados.sucesso) {
                alert('Cadastro realizado com sucesso!');
                window.location.href = 'login.html';
            } else {
                alert(dados.erro);
            }
        });
    </script>
</body>
</html>
